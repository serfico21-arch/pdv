name: Construir instalador

# Roda sozinho quando você sobe uma nova versão do sistema (ou mexe no instalador / nas notas).
on:
  push:
    branches: [main]
    paths:
      - 'fcosta-gestor.html'
      - 'notas-versao.txt'
      - 'instalador.nsi'
      - 'icon.ico'
      - 'modern-wizard.bmp'
      - 'construir.sh'
      - 'publicar.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: construir-instalador
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas (NSIS e 7-Zip)
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis 7zip

      - name: Construir e conferir o instalador
        run: |
          bash construir.sh

      - name: Guardar o resultado no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FCostaGestor-Instalador.exe versao.json index.html README.md
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Instalador atualizado automaticamente (v$(python3 publicar.py versao))"
            git push
          fi
