/* ---------------- Licença (ativação por cliente) ----------------
   A chave é assinada por você (ECDSA P-256) e amarrada ao ID desta instalação.
   Aqui só existe a chave PÚBLICA: serve para conferir, nunca para criar licenças. */
const LIC_PUB = { kty:'EC', crv:'P-256', x:'fRYCp4u_w5oTMKKsqqM4EKdDZMO6fcJN0paQPLb1v9w', y:'fCzZ900C6KuiM8Lq5DnDtciJAKA-NhhmDBqRpav3_fI', ext:true };
const LIC_TRIAL_DIAS = 15;
const LIC_CONTATO = 'Para obter sua chave de ativação, fale com o FCosta Gestor e informe o ID acima.';
const K_LIC = { id:'pc_lic_id', chave:'pc_lic_chave', trial:'pc_lic_trial', visto:'pc_lic_visto' };
let _lic = { id:'', est:null, resolve:null };

function licDias(de, ate){
  const a = new Date(de+'T00:00:00'), b = new Date(ate+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function licDataBR(iso){ return iso ? iso.split('-').reverse().join('/') : ''; }
function licB64(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s += '=';
  const bin = atob(s), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function licNovoId(){
  const al = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', r = new Uint8Array(12);
  crypto.getRandomValues(r);
  let s = '';
  for(let i=0;i<12;i++){ s += al[r[i]%al.length]; if(i===3||i===7) s += '-'; }
  return s;
}
async function licVerificar(texto){
  const t = String(texto||'').replace(/\s+/g,'');
  if(!/^FCG1-[\w-]+\.[\w-]+$/.test(t)) return { ok:false, motivo:'Chave em formato inválido. Cole a chave inteira, começando por FCG1-.' };
  if(!(window.crypto && crypto.subtle)) return { ok:false, motivo:'Este navegador não permite conferir a chave. Abra o sistema no Chrome ou Edge.' };
  try{
    const [p, s] = t.slice(5).split('.');
    const payload = licB64(p), sig = licB64(s);
    const k = await crypto.subtle.importKey('jwk', LIC_PUB, { name:'ECDSA', namedCurve:'P-256' }, false, ['verify']);
    const ok = await crypto.subtle.verify({ name:'ECDSA', hash:'SHA-256' }, k, sig, payload);
    if(!ok) return { ok:false, motivo:'Chave inválida (assinatura não confere).' };
    const d = JSON.parse(new TextDecoder().decode(payload));
    if(String(d.id||'').replace(/-/g,'') !== _lic.id.replace(/-/g,'')) return { ok:false, motivo:'Esta chave foi emitida para outro computador/instalação.' };
    return { ok:true, dados:d };
  }catch(e){ return { ok:false, motivo:'Chave inválida.' }; }
}
async function licAvaliar(){
  if(!_lic.id){
    _lic.id = await loadKey(K_LIC.id, '');
    if(!_lic.id){ _lic.id = licNovoId(); await saveKey(K_LIC.id, _lic.id); }
  }
  const hoje = todayISODate();
  let visto = await loadKey(K_LIC.visto, '');
  const relogioVoltou = !!visto && licDias(visto, hoje) < 0;   // data do computador foi voltada
  if(!relogioVoltou && visto !== hoje) await saveKey(K_LIC.visto, hoje);

  const chave = await loadKey(K_LIC.chave, '');
  if(chave){
    const r = await licVerificar(chave);
    if(r.ok){
      const d = r.dados;
      if(!d.expira) return { tipo:'ativa', dados:d };
      if(!relogioVoltou && licDias(hoje, d.expira) >= 0) return { tipo:'ativa', dados:d, restam:licDias(hoje, d.expira) };
      return { tipo:'expirada', dados:d, motivo: relogioVoltou ? 'A data do computador foi alterada. Corrija a data e reabra o sistema.' : 'Sua licença venceu em '+licDataBR(d.expira)+'. Peça a renovação.' };
    }
  }
  let ini = await loadKey(K_LIC.trial, '');
  if(!ini){ ini = hoje; await saveKey(K_LIC.trial, ini); }
  const usados = relogioVoltou ? LIC_TRIAL_DIAS : Math.max(0, licDias(ini, hoje));
  const restam = LIC_TRIAL_DIAS - usados;
  if(restam > 0) return { tipo:'teste', restam };
  return { tipo:'teste_fim', motivo:'O período de teste de '+LIC_TRIAL_DIAS+' dias terminou. Ative o sistema para continuar.' };
}
function licAtualizarBadge(){
  const b = document.getElementById('licBadge'); if(!b) return;
  const e = _lic.est; let txt = '';
  if(e && e.tipo==='teste') txt = '⏳ Teste: '+e.restam+(e.restam===1?' dia':' dias');
  else if(e && e.tipo==='ativa' && e.restam!==undefined && e.restam<=30) txt = '🔑 Licença vence em '+e.restam+(e.restam===1?' dia':' dias');
  b.textContent = txt; b.style.display = txt ? '' : 'none';
}
function licFechar(){
  const el = document.getElementById('licTela'); if(el) el.remove();
  if(_lic.resolve){ const r = _lic.resolve; _lic.resolve = null; r(); }
}
function licMostrar(fechavel){
  const e = _lic.est, bloqueado = (e.tipo==='expirada' || e.tipo==='teste_fim');
  let el = document.getElementById('licTela'); if(el) el.remove();
  el = document.createElement('div'); el.id = 'licTela';
  el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(20,16,12,.94);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;';
  let status = '';
  if(e.tipo==='ativa') status = '<p style="color:#2e7d32;font-weight:600;margin:0 0 6px">✅ Sistema ativado</p><p style="margin:0 0 12px;font-size:.92rem">Licenciado para: <strong>'+escapeHtml(e.dados.cliente)+'</strong><br>Validade: <strong>'+(e.dados.expira ? licDataBR(e.dados.expira) : 'vitalícia')+'</strong></p>';
  else if(e.tipo==='teste') status = '<p style="margin:0 0 12px">⏳ Período de teste: restam <strong>'+e.restam+(e.restam===1?' dia':' dias')+'</strong>.</p>';
  else status = '<p style="color:#b2402f;font-weight:600;margin:0 0 12px">'+escapeHtml(e.motivo)+'</p>';
  const continuar = (e.tipo==='teste') ? '<button class="btn btn-ghost" onclick="licFechar()">Continuar no teste</button>' : (fechavel && !bloqueado ? '<button class="btn btn-ghost" onclick="licFechar()">Fechar</button>' : '');
  el.innerHTML = '<div style="background:#fff;color:#2b2622;max-width:520px;width:100%;border-radius:14px;padding:24px 26px;box-shadow:0 10px 40px rgba(0,0,0,.5)">'
    + '<h2 style="margin:0 0 4px;font-size:1.3rem">🔑 Ativação do FCosta Gestor</h2><div style="height:10px"></div>' + status
    + '<p style="margin:0 0 4px;font-size:.85rem;color:#6d645b">ID desta instalação:</p>'
    + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><code id="licIdTxt" style="flex:1;font-size:1.15rem;font-weight:700;letter-spacing:1px;background:#faf7f2;border:1px solid #e5ddd2;border-radius:8px;padding:8px 10px;user-select:all">'+escapeHtml(_lic.id)+'</code><button class="btn btn-ghost btn-sm" onclick="licCopiarId()">Copiar</button></div>'
    + '<p style="margin:0 0 14px;font-size:.85rem;color:#6d645b">'+escapeHtml(LIC_CONTATO)+'</p>'
    + '<textarea id="licChave" rows="4" placeholder="Cole aqui a chave de ativação (FCG1-...)" style="width:100%;box-sizing:border-box;border:1px solid #cfc5b8;border-radius:8px;padding:8px;font:12px/1.4 monospace;resize:vertical"></textarea>'
    + '<p id="licErro" style="color:#b2402f;margin:6px 0 0;font-size:.9rem;min-height:1.2em"></p>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap">'+continuar+'<button class="btn btn-primary" onclick="licAtivar()">Ativar</button></div></div>';
  document.body.appendChild(el);
}
function licCopiarId(){
  try{ navigator.clipboard.writeText(_lic.id); showToast('ID copiado.'); }
  catch(e){ const r = document.createRange(); r.selectNodeContents(document.getElementById('licIdTxt')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
}
async function licAtivar(){
  const txt = document.getElementById('licChave').value, erro = document.getElementById('licErro');
  const r = await licVerificar(txt);
  if(!r.ok){ erro.textContent = r.motivo; return; }
  await saveKey(K_LIC.chave, txt.replace(/\s+/g,''));
  _lic.est = await licAvaliar();
  if(_lic.est.tipo!=='ativa'){ erro.textContent = _lic.est.motivo || 'Esta chave não está mais válida.'; licMostrar(false); return; }
  licAtualizarBadge(); licFechar(); showToast('✅ Sistema ativado. Obrigado!', 4000);
}
function abrirModalLicenca(){ if(_lic.est) licMostrar(true); }
async function garantirLicenca(){
  _lic.est = await licAvaliar();
  licAtualizarBadge();
  await new Promise(res=>{
    if(_lic.est.tipo==='ativa') return res();
    _lic.resolve = res; licMostrar(false);
  });
  setInterval(async ()=>{            // revalida enquanto o sistema fica aberto (virada de dia, vencimento)
    try{
      _lic.est = await licAvaliar(); licAtualizarBadge();
      if((_lic.est.tipo==='expirada' || _lic.est.tipo==='teste_fim') && !document.getElementById('licTela')) licMostrar(false);
    }catch(e){ /* ignora */ }
  }, 30*60*1000);
}

/* ---------------- Redefinição de acesso (código do suporte) ----------------
   Para quando o cliente esquece a senha e a pergunta de segurança. O código é assinado
   por você, vale só para esta instalação, por 3 dias, e só pode ser usado uma vez.
   Apaga APENAS os usuários/senhas; produtos, vendas e demais dados ficam intactos. */
const K_RESET = 'pc_lic_reset_usados';
async function licVerificarReset(texto){
  const t = String(texto||'').replace(/\s+/g,'');
  if(!/^FCGR1-[\w-]+\.[\w-]+$/.test(t)) return { ok:false, motivo:'Código em formato inválido. Cole o código inteiro, começando por FCGR1-.' };
  if(!(window.crypto && crypto.subtle)) return { ok:false, motivo:'Este navegador não permite conferir o código. Abra o sistema no Chrome ou Edge.' };
  try{
    const [p, s] = t.slice(6).split('.');
    const payload = licB64(p), sig = licB64(s);
    const k = await crypto.subtle.importKey('jwk', LIC_PUB, { name:'ECDSA', namedCurve:'P-256' }, false, ['verify']);
    if(!(await crypto.subtle.verify({ name:'ECDSA', hash:'SHA-256' }, k, sig, payload))) return { ok:false, motivo:'Código inválido (assinatura não confere).' };
    const d = JSON.parse(new TextDecoder().decode(payload));
    if(d.tipo!=='reset') return { ok:false, motivo:'Código inválido.' };
    if(String(d.id||'').replace(/-/g,'') !== _lic.id.replace(/-/g,'')) return { ok:false, motivo:'Este código foi emitido para outro computador/instalação.' };
    if(licDias(todayISODate(), d.expira) < 0) return { ok:false, motivo:'Código vencido. Peça um novo.' };
    const usados = await loadKey(K_RESET, []);
    if(usados.includes(d.n)) return { ok:false, motivo:'Este código já foi usado. Peça um novo.' };
    return { ok:true, dados:d };
  }catch(e){ return { ok:false, motivo:'Código inválido.' }; }
}
function abrirResetAcesso(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg"><div class="modal">
      <h3>Redefinir acesso (código do suporte)</h3>
      <p class="muted">Use só se esqueceu usuário, senha e a pergunta de segurança. Envie ao suporte o ID abaixo e cole o código recebido. <strong>Isso apaga apenas os logins</strong> — produtos, vendas e financeiro continuam. Depois você cria um novo administrador.</p>
      <div class="field"><label>ID desta instalação</label><input readonly value="${escapeHtml(_lic.id)}" onclick="this.select()"></div>
      <div id="rsErr"></div>
      <div class="field"><label>Código de redefinição</label><textarea id="rsCodigo" rows="4" placeholder="FCGR1-..." style="width:100%;font:12px/1.4 monospace;"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="askCadastroPassword()">Voltar</button>
        <button class="btn btn-primary" onclick="aplicarResetAcesso()">Redefinir</button>
      </div>
    </div></div>`;
}
async function aplicarResetAcesso(){
  const r = await licVerificarReset(document.getElementById('rsCodigo').value);
  if(!r.ok){ document.getElementById('rsErr').innerHTML = '<div class="errmsg">'+escapeHtml(r.motivo)+'</div>'; return; }
  const usados = await loadKey(K_RESET, []); usados.push(r.dados.n);
  await saveKey(K_RESET, usados.slice(-50));
  DB.settings.usuarios = [];
  await saveKey(KEYS.settings, DB.settings);
  cadastrosUnlocked = false;
  showToast('Acesso redefinido. Crie um novo administrador.', 4500);
  askCadastroPassword();
}

/* ---------------- Inicialização ---------------- */
(async function init(){
  await loadAll();
  await garantirLicenca();
  fillOperatorSelect();
  updateBrandMark();
  aplicarLarguraImpressao();
  renderNav();
  renderContent();
  iniciarBackupAutomatico();
  iniciarVerificacaoAtualizacao();
  mostrarVersaoNoTopo();
  setTimeout(()=>mostrarVersaoAtualizada(false), 1200);
})();
/* ---- Versão grande e destacada: no topo sempre, e uma janela grande quando o gestor é atualizado ---- */
function mostrarVersaoNoTopo(){
  const b = document.getElementById('versaoBadge'); if(b) b.textContent = 'Versão ' + APP_VERSAO;
}
function mostrarVersaoAtualizada(forcar, tentativa){
  let vista = null; try{ vista = localStorage.getItem('pc_versao_aberta'); }catch(e){}
  if(!forcar && vista === APP_VERSAO) return;
  if(!forcar && document.querySelector('#modalRoot .modal-bg')){ // espera a outra janela (ex.: licença) fechar
    if((tentativa||0) < 120) setTimeout(()=>mostrarVersaoAtualizada(false, (tentativa||0)+1), 1000);
    return;
  }
  try{ localStorage.setItem('pc_versao_aberta', APP_VERSAO); }catch(e){}
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="text-align:center; max-width:520px;">
        <div style="font-size:64px; line-height:1;">${forcar?'ℹ️':'✅'}</div>
        <div style="font-size:26px; font-weight:800; margin-top:10px; color:#14206b;">${forcar?'Versão instalada':'Gestor atualizado!'}</div>
        <div style="display:inline-block; margin:18px 0 8px; background:#eed600; color:#14206b; font-size:44px; font-weight:900; padding:10px 28px; border-radius:16px;">Versão ${APP_VERSAO}</div>
        <div class="muted" style="font-size:16px; margin-bottom:18px;">Este é o número que aparece em amarelo no topo da tela.</div>
        <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
          <button class="btn btn-outline" onclick="closeModal(); verificarAtualizacao(true)">🔄 Ver se tem versão mais nova</button>
          <button class="btn btn-primary" onclick="closeModal()">OK</button>
        </div>
      </div>
    </div>`;
}
