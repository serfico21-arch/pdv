function renderRelatorioFinanceiro(){
  const {ini, fim} = periodoRange();
  const vendas = DB.sales.filter(s=>inRange(s.date, ini, fim));
  const lanc = DB.lancamentos.filter(l=>inRange(l.date, ini, fim));
  const totalVendas = vendas.reduce((a,s)=>a+s.total,0);
  const somaFormas = somarPorFormaPagamento(vendas);
  const totalDinheiro = somaFormas.dinheiro;
  const totalCartaoCredito = somaFormas.cartaoCredito;
  const totalCartaoDebito = somaFormas.cartaoDebito;
  const totalCartao = somaFormas.cartao;
  const totalCartaoSemSeparar = Math.max(0, totalCartao - totalCartaoCredito - totalCartaoDebito);
  const totalPix = somaFormas.pix;
  const totalFiado = vendas.filter(s=>s.payMethod==='fiado').reduce((a,s)=>a+s.total,0);
  const cogs = vendas.reduce((a,s)=>a + s.items.reduce((b,i)=>b+(i.cost||0)*i.qty,0), 0);
  const lucroBruto = totalVendas - cogs;
  // Recebimentos de fiado NÃO entram de novo no lucro: a receita já foi contada em totalVendas
  // no momento da venda. Aqui eles só representam a troca de "a receber" por "dinheiro em caixa".
  const entradasFinSemFiado = lanc.filter(l=>l.type==='entrada' && l.category!=='Recebimento fiado').reduce((a,l)=>a+l.value,0);
  const saidasFin = lanc.filter(l=>l.type==='saida').reduce((a,l)=>a+l.value,0);
  const recebFiadoPeriodo = lanc.filter(l=>l.category==='Recebimento fiado');
  const totalRecebFiadoPeriodo = recebFiadoPeriodo.reduce((a,l)=>a+l.value,0);
  const lucroLiquido = lucroBruto + entradasFinSemFiado - saidasFin;
  const totalAReceberGeral = DB.clients.reduce((a,c)=>a+(c.saldoDevedor||0),0);

  const porProduto = {};
  vendas.forEach(s=>s.items.forEach(i=>{
    porProduto[i.name] = porProduto[i.name] || {qty:0, total:0};
    porProduto[i.name].qty += i.qty; porProduto[i.name].total += i.price*i.qty;
  }));
  const top = Object.entries(porProduto).sort((a,b)=>b[1].qty-a[1].qty).slice(0,8);
  const maxQty = top.length? top[0][1].qty : 1;

  const porCategoria = {};
  lanc.filter(l=>l.type==='saida').forEach(l=>{ porCategoria[l.category]=(porCategoria[l.category]||0)+l.value; });
  const catList = Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]);
  const maxCat = catList.length? catList[0][1] : 1;

  return `
  ${periodoSeletorHTML()}
  <div class="stat-row">
    <div class="stat accent"><div class="lbl">Total de vendas</div><div class="val">${brl(totalVendas)}</div></div>
    <div class="stat"><div class="lbl">Custo das mercadorias vendidas</div><div class="val" style="font-size:19px;">${brl(cogs)}</div></div>
    <div class="stat"><div class="lbl">Lucro bruto</div><div class="val" style="font-size:19px;">${brl(lucroBruto)}</div></div>
    <div class="stat ${lucroLiquido<0?'bad':''}"><div class="lbl">Lucro líquido (com lançamentos)</div><div class="val" style="font-size:19px;">${brl(lucroLiquido)}</div></div>
  </div>
  ${totalAReceberGeral>0?`<div class="alert-banner" style="background:#fff6df;border-color:var(--terracota-esc);">
    <div class="txt" style="color:var(--terracota-esc);">💳 Total em aberto para receber de clientes (fiado): <strong>${brl(totalAReceberGeral)}</strong> — mercadoria já saiu, dinheiro ainda não entrou</div>
    <button class="btn btn-outline btn-sm" onclick="switchTab('cadastros')">Ver clientes</button>
  </div>`:''}

  <div class="grid2">
    <div class="card">
      <h2>Vendas por forma de pagamento</h2>
      <div class="bar-row"><div class="bar-lbl">Dinheiro</div><div class="bar-track"><div class="bar-fill" style="width:${totalVendas?totalDinheiro/totalVendas*100:0}%"></div></div><div class="bar-val">${brl(totalDinheiro)}</div></div>
      <div class="bar-row"><div class="bar-lbl">Cartão Crédito</div><div class="bar-track"><div class="bar-fill" style="width:${totalVendas?totalCartaoCredito/totalVendas*100:0}%"></div></div><div class="bar-val">${brl(totalCartaoCredito)}</div></div>
      <div class="bar-row"><div class="bar-lbl">Cartão Débito</div><div class="bar-track"><div class="bar-fill" style="width:${totalVendas?totalCartaoDebito/totalVendas*100:0}%"></div></div><div class="bar-val">${brl(totalCartaoDebito)}</div></div>
      ${totalCartaoSemSeparar>0.001?`<div class="bar-row"><div class="bar-lbl">Cartão (sem separar)</div><div class="bar-track"><div class="bar-fill" style="width:${totalVendas?totalCartaoSemSeparar/totalVendas*100:0}%"></div></div><div class="bar-val">${brl(totalCartaoSemSeparar)}</div></div>`:''}
      <div class="bar-row"><div class="bar-lbl">Pix</div><div class="bar-track"><div class="bar-fill" style="width:${totalVendas?totalPix/totalVendas*100:0}%"></div></div><div class="bar-val">${brl(totalPix)}</div></div>
      <div class="bar-row"><div class="bar-lbl">Fiado</div><div class="bar-track"><div class="bar-fill" style="width:${totalVendas?totalFiado/totalVendas*100:0}%"></div></div><div class="bar-val">${brl(totalFiado)}</div></div>
      <div class="small-note">${vendas.length} venda(s) no período</div>
      ${somaFormas.mistoCount>0?`<div class="small-note">🔀 ${somaFormas.mistoCount} venda(s) com pagamento misto no período — valores já divididos acima.</div>`:''}
      ${totalCartaoSemSeparar>0.001?`<div class="small-note">ℹ️ "Cartão (sem separar)" são vendas registradas como Cartão antes da separação em Crédito/Débito.</div>`:''}
    </div>
    <div class="card">
      <h2>Financeiro (entradas e saídas)</h2>
      <table>
        <tbody>
          <tr><td>Vendas (caixa, inclui fiado já faturado)</td><td class="right">${brl(totalVendas)}</td></tr>
          <tr><td class="muted" style="padding-left:18px;">&nbsp;&nbsp;↳ Dinheiro</td><td class="right muted">${brl(totalDinheiro)}</td></tr>
          <tr><td class="muted" style="padding-left:18px;">&nbsp;&nbsp;↳ Cartão (todos)</td><td class="right muted">${brl(totalCartao)}</td></tr>
          <tr><td class="muted" style="padding-left:18px;">&nbsp;&nbsp;↳ Pix</td><td class="right muted">${brl(totalPix)}</td></tr>
          <tr><td class="muted" style="padding-left:18px;">&nbsp;&nbsp;↳ Fiado</td><td class="right muted">${brl(totalFiado)}</td></tr>
          <tr><td>Outras entradas</td><td class="right">${brl(entradasFinSemFiado)}</td></tr>
          <tr><td>Custo de mercadorias (CMV)</td><td class="right">−${brl(cogs)}</td></tr>
          <tr><td>Despesas / saídas</td><td class="right">−${brl(saidasFin)}</td></tr>
          <tr><td><strong>Resultado do período</strong></td><td class="right"><strong>${brl(lucroLiquido)}</strong></td></tr>
        </tbody>
      </table>
      ${totalRecebFiadoPeriodo>0?`<div class="small-note">💰 Neste período, ${brl(totalRecebFiadoPeriodo)} de fiado antigo virou dinheiro em caixa — não é somado de novo aqui porque a venda já entrou em "Vendas (caixa)" quando aconteceu.</div>`:''}
    </div>
  </div>

  <div class="card">
    <h2>Produtos mais vendidos</h2>
    ${top.length===0 ? '<div class="empty-state">Sem vendas no período.</div>' : top.map(([name,d])=>`
      <div class="bar-row"><div class="bar-lbl" style="width:160px;">${escapeHtml(name)}</div><div class="bar-track"><div class="bar-fill" style="width:${d.qty/maxQty*100}%"></div></div><div class="bar-val">${d.qty} un · ${brl(d.total)}</div></div>
    `).join('')}
  </div>

  <div class="card">
    <h2>Despesas por categoria</h2>
    ${catList.length===0 ? '<div class="empty-state">Sem despesas lançadas no período.</div>' : catList.map(([cat,val])=>`
      <div class="bar-row"><div class="bar-lbl" style="width:160px;">${escapeHtml(cat)}</div><div class="bar-track"><div class="bar-fill" style="width:${val/maxCat*100}%; background:linear-gradient(90deg, var(--vermelho), var(--terracota));"></div></div><div class="bar-val">${brl(val)}</div></div>
    `).join('')}
  </div>`;
}

  const porFornecedorPeriodo = {};
  entradas.forEach(m=>{
    const p = DB.products.find(x=>x.id===m.productId);
    const nome = p ? fornecedorNome(p.supplierId) : '—';
    porFornecedorPeriodo[nome] = porFornecedorPeriodo[nome] || {qtd:0, valor:0};

  });
  const listaPeriodo = Object.entries(porFornecedorPeriodo).sort((a,b)=>b[1].valor-a[1].valor);
  const maxValorPeriodo = listaPeriodo.length? Math.max(...listaPeriodo.map(x=>x[1].valor)) : 1;

  const fornecedores = [...DB.suppliers].sort((a,b)=>a.name.localeCompare(b.name));

    const prods = DB.products.filter(p=>p.supplierId===f.id);
    const valorEstoque = prods.reduce((s,p)=>s+p.cost*p.stock,0);

    <table>
      <thead><tr><th>Fornecedor</th><th>Contato</th><th>Produtos vinculados</th><th class="right">Valor em estoque (custo)</th></tr></thead>

function renderRelatorioMercadorias(){

    `).join('')}

          </tr>`).join('')}
      </tbody>
    </table>`}

}

/* ================================================================
   EXPORTAÇÃO DE RELATÓRIOS EM PDF
   (HTML simples e independente do tema, com cores fixas e fonte do
   sistema — o html2canvas não renderiza bem variáveis CSS, gradientes
   e fontes externas do tema, o que fazia o PDF sair em branco)
   ================================================================ */
function nomeArquivoRelatorio(prefixo){
  return `${prefixo}-${todayISODate()}.pdf`;
}
function mostrarStatusPDF(msg){
  const el = document.getElementById('pdfStatusMsg');
  if(el) el.textContent = msg;
}
function pdfNovoDoc(){
  const { jsPDF } = window.jspdf;
  return new jsPDF({unit:'mm', format:'a4'});
}
function formatoImagemPDF(dataUrl){
  const m = /^data:image\/(\w+);base64,/.exec(dataUrl||'');
  const ext = m ? m[1].toLowerCase() : 'jpeg';
  if(ext==='jpg' || ext==='jpeg') return 'JPEG';
  if(ext==='png') return 'PNG';
  if(ext==='webp') return 'WEBP';
  return 'JPEG';
}
function pdfCabecalho(doc, titulo){
  const s = DB.settings;
  let xTexto = 14;
  let yLinhaBase = 21;
  if(s.logoBase64){
    try{
      const alturaLogo = 16;
      let largura = s.logoWidth && s.logoHeight ? (alturaLogo * s.logoWidth / s.logoHeight) : alturaLogo;
      largura = Math.max(8, Math.min(40, largura)); // evita logo excessivamente larga ou estreita distorcer o layout
      doc.addImage(s.logoBase64, formatoImagemPDF(s.logoBase64), 14, 8, largura, alturaLogo);
      xTexto = 14 + largura + 6;
    }catch(e){ /* se a imagem falhar, segue sem logo no PDF */ }
  }
  doc.setFontSize(13);
  doc.setTextColor(11,42,82);
  doc.setFont(undefined,'bold');
  doc.text(s.storeName || 'FCosta', xTexto, 13);
  doc.setFont(undefined,'normal');
  doc.setFontSize(9);
  doc.setTextColor(90,90,90);
  const linhaLoja = [s.cnpj?('CNPJ: '+s.cnpj):'', s.endereco||'', s.telefone?('Tel: '+s.telefone):''].filter(Boolean).join('  ·  ');
  if(linhaLoja) doc.text(linhaLoja, xTexto, 18);
  doc.setFontSize(14);
  doc.setTextColor(11,42,82);
  doc.text(titulo, xTexto, linhaLoja?25:22);
  yLinhaBase = (linhaLoja?28:25);
  doc.setDrawColor(11,42,82);
  doc.setLineWidth(0.5);
  doc.line(14, yLinhaBase, 196, yLinhaBase);
  doc.setTextColor(20,20,20);
  return yLinhaBase + 9;
}
function pdfSubtituloDoc(doc, y, txt){
  doc.setFontSize(12);
  doc.setTextColor(11,42,82);
  doc.text(txt, 14, y);
  doc.setTextColor(20,20,20);
  return y + 6;
}
function pdfTabelaIndicadores(doc, y, linhas){
  doc.autoTable({
    startY: y,
    head: [['Indicador','Valor']],
    body: linhas,
    theme:'grid',
    styles:{fontSize:10, cellPadding:3},
    headStyles:{fillColor:[11,42,82], textColor:255},
    margin:{left:14, right:14}
  });
  return doc.lastAutoTable.finalY + 10;
}
function pdfSemDados(doc, y, msg){
  doc.setFontSize(10); doc.setTextColor(120,120,120);
  doc.text(msg, 14, y);
  doc.setTextColor(20,20,20);
  return y + 8;
}
function gerarPDFFinanceiro(doc, yInicial){
  const {ini, fim} = periodoRange();
  const vendas = DB.sales.filter(s=>inRange(s.date, ini, fim));
  const lanc = DB.lancamentos.filter(l=>inRange(l.date, ini, fim));
  const totalVendas = vendas.reduce((a,s)=>a+s.total,0);
  const somaFormas = somarPorFormaPagamento(vendas);
  const totalFiado = vendas.filter(s=>s.payMethod==='fiado').reduce((a,s)=>a+s.total,0);
  const cogs = vendas.reduce((a,s)=>a + s.items.reduce((b,i)=>b+(i.cost||0)*i.qty,0), 0);
  const lucroBruto = totalVendas - cogs;
  const entradasFinSemFiado = lanc.filter(l=>l.type==='entrada' && l.category!=='Recebimento fiado').reduce((a,l)=>a+l.value,0);
  const saidasFin = lanc.filter(l=>l.type==='saida').reduce((a,l)=>a+l.value,0);
  const lucroLiquido = lucroBruto + entradasFinSemFiado - saidasFin;
  const porProduto = {};
  vendas.forEach(s=>s.items.forEach(i=>{
    porProduto[i.name] = porProduto[i.name] || {qty:0, total:0};
    porProduto[i.name].qty += i.qty; porProduto[i.name].total += i.price*i.qty;
  }));
  const top = Object.entries(porProduto).sort((a,b)=>b[1].qty-a[1].qty).slice(0,10);

  let y = pdfCabecalho(doc, 'Relatório Financeiro — período: '+ini+' a '+fim);
  y = pdfTabelaIndicadores(doc, y, [
    ['Total de vendas', brl(totalVendas)],
    ['Custo das mercadorias vendidas', brl(cogs)],
    ['Lucro bruto', brl(lucroBruto)],
    ['Lucro líquido (com lançamentos)', brl(lucroLiquido)]
  ]);
  y = pdfSubtituloDoc(doc, y, 'Vendas por forma de pagamento ('+vendas.length+' venda(s) no período)');
  const cartaoSemSepararPdf = Math.max(0, somaFormas.cartao - somaFormas.cartaoCredito - somaFormas.cartaoDebito);
  doc.autoTable({
    startY: y,
    head: [['Forma','Valor']],
    body: [
      ['Dinheiro', brl(somaFormas.dinheiro)],
      ['Cartão Crédito', brl(somaFormas.cartaoCredito)],
      ['Cartão Débito', brl(somaFormas.cartaoDebito)],
      ...(cartaoSemSepararPdf>0.001 ? [['Cartão (sem separar)', brl(cartaoSemSepararPdf)]] : []),
      ['Pix', brl(somaFormas.pix)],
      ['Fiado', brl(totalFiado)]
    ],
    theme:'grid', styles:{fontSize:10, cellPadding:3},
    headStyles:{fillColor:[24,122,82], textColor:255},
    margin:{left:14,right:14}
  });
  y = doc.lastAutoTable.finalY + 10;
  y = pdfSubtituloDoc(doc, y, 'Produtos mais vendidos');
  if(top.length){
    doc.autoTable({
      startY:y,
      head:[['Produto','Qtd.','Total']],
      body: top.map(([name,d])=>[name, String(d.qty), brl(d.total)]),
      theme:'grid', styles:{fontSize:9, cellPadding:2.5},
      headStyles:{fillColor:[24,122,82], textColor:255},
      margin:{left:14,right:14}
    });
    y = doc.lastAutoTable.finalY + 6;
  } else {
    y = pdfSemDados(doc, y, 'Sem vendas no período.');
  }
  return y;
}
function gerarPDFOperador(doc, yInicial){
  const {ini, fim} = periodoRange();
  const vendasPeriodo = DB.sales.filter(s=>inRange(s.date, ini, fim));
  const vendas = relOperadorSelecionado==='todos' ? vendasPeriodo : vendasPeriodo.filter(s=>s.operator===relOperadorSelecionado);
  const linhas = itensAgrupadosPorProduto(vendas);
  const totalBruto = linhas.reduce((a,l)=>a+l.total,0);
  const subtitulo = relOperadorSelecionado==='todos' ? 'Todos os operadores' : relOperadorSelecionado;
  let y = pdfCabecalho(doc, 'Vendas por Operador — período: '+ini+' a '+fim);
  y = pdfSubtituloDoc(doc, y, 'Operador: '+subtitulo+' ('+vendas.length+' venda(s))');
  if(linhas.length===0){
    y = pdfSemDados(doc, y, 'Nenhuma venda encontrada para esse período/operador.');
  }else{
    doc.autoTable({
      startY: y,
      head: [['Código','Descrição do produto','Unid','Qtde','Vr. Unit.','Desconto','Vr. Total']],
      body: linhas.map(l=>[l.codigo, l.descricao, l.unid, l.unid==='KG'?Number(l.qtde).toFixed(3):String(l.qtde), brl(l.total/l.qtde), brl(0), brl(l.total)]),
      theme:'grid', styles:{fontSize:9, cellPadding:2.5},
      headStyles:{fillColor:[24,122,82], textColor:255},
      margin:{left:14,right:14}
    });
    y = doc.lastAutoTable.finalY + 8;
    y = pdfTabelaIndicadores(doc, y, [['Total Bruto', brl(totalBruto)]]);
  }
  return y;
}
function gerarPDFFornecedores(doc, yInicial){
  const {ini, fim} = periodoRange();
  const entradas = DB.movements.filter(m=>m.type==='entrada' && m.reason!=='Estorno — venda excluída' && inRange(m.date, ini, fim));
  const porFornecedorPeriodo = {};
  entradas.forEach(m=>{
    const p = DB.products.find(x=>x.id===m.productId);
    const nome = p ? fornecedorNome(p.supplierId) : '—';
    porFornecedorPeriodo[nome] = porFornecedorPeriodo[nome] || {qtd:0, valor:0};
    porFornecedorPeriodo[nome].qtd += m.qty;
    porFornecedorPeriodo[nome].valor += (p?p.cost:0) * m.qty;
  });
  const listaPeriodo = Object.entries(porFornecedorPeriodo).sort((a,b)=>b[1].valor-a[1].valor);
  const fornecedores = [...DB.suppliers].sort((a,b)=>a.name.localeCompare(b.name));
  const resumoGeral = fornecedores.map(f=>{
    const prods = DB.products.filter(p=>p.supplierId===f.id);
    const valorEstoque = prods.reduce((s,p)=>s+p.cost*p.stock,0);
    return {fornecedor:f, qtdProdutos:prods.length, valorEstoque};
  });

  let y = pdfCabecalho(doc, 'Relatório de Fornecedores — período: '+ini+' a '+fim);
  y = pdfSubtituloDoc(doc, y, 'Compras recebidas por fornecedor (no período)');
  if(listaPeriodo.length){
    doc.autoTable({ startY:y, head:[['Fornecedor','Qtd.','Valor']],
      body: listaPeriodo.map(([nome,d])=>[nome, String(d.qtd), brl(d.valor)]),
      theme:'grid', styles:{fontSize:9,cellPadding:2.5}, headStyles:{fillColor:[24,122,82],textColor:255}, margin:{left:14,right:14}});
    y = doc.lastAutoTable.finalY + 10;
  } else {
    y = pdfSemDados(doc, y, 'Nenhuma entrada de mercadoria no período.');
  }
  y = pdfSubtituloDoc(doc, y, 'Fornecedores cadastrados — resumo geral');
  if(resumoGeral.length){
    doc.autoTable({ startY:y, head:[['Fornecedor','Contato','Produtos','Valor em estoque (custo)']],
      body: resumoGeral.map(r=>[r.fornecedor.name, r.fornecedor.telefone||r.fornecedor.contato||'—', String(r.qtdProdutos), brl(r.valorEstoque)]),
      theme:'grid', styles:{fontSize:9,cellPadding:2.5}, headStyles:{fillColor:[24,122,82],textColor:255}, margin:{left:14,right:14}});
    y = doc.lastAutoTable.finalY + 6;
  } else {
    y = pdfSemDados(doc, y, 'Nenhum fornecedor cadastrado ainda.');
  }
  return y;
}
function gerarPDFMercadorias(doc, yInicial){
  const prods = [...DB.products].sort((a,b)=>a.name.localeCompare(b.name));

function baixarRelatorioAtualPDF(){
  if(!window.jspdf){ showToast('❌ Biblioteca de PDF não carregou (sem internet?). Tente novamente.'); return; }
  const nomes = {financeiro:'relatorio-financeiro', operador:'relatorio-vendas-por-operador', fornecedores:'relatorio-fornecedores', mercadorias:'relatorio-mercadorias'};
  const geradores = {financeiro:gerarPDFFinanceiro, operador:gerarPDFOperador, fornecedores:gerarPDFFornecedores, mercadorias:gerarPDFMercadorias};
  const arquivo = nomeArquivoRelatorio(nomes[relSubTab] || 'relatorio');
  mostrarStatusPDF('⏳ Gerando PDF...');
  try{
    const doc = pdfNovoDoc();
    (geradores[relSubTab]||gerarPDFFinanceiro)(doc, 20);
    doc.save(arquivo);
    mostrarStatusPDF('');
    showToast('✅ PDF baixado: '+arquivo);
  }catch(err){
    console.error(err);
    mostrarStatusPDF('');
    showToast('❌ Erro ao gerar PDF: '+(err&&err.message?err.message:err));
  }
}
function baixarTodosRelatoriosPDF(){
  if(!window.jspdf){ showToast('❌ Biblioteca de PDF não carregou (sem internet?). Tente novamente.'); return; }
  mostrarStatusPDF('⏳ Gerando PDF com todos os relatórios...');
  try{

// ---------- Produtos repetidos: achar e juntar (o estoque é somado, nada se perde) ----------
function gruposDuplicados(){
  const prods = DB.products||[], pai = {};
  const raiz = id => { while(pai[id]!==id){ pai[id]=pai[pai[id]]; id=pai[id]; } return id; };
  prods.forEach(p=>pai[p.id]=p.id);
  const porChave = {};
  prods.forEach(p=>{
    const c = chaveCodigo(p.barcode), n = chaveNome(p.name);
    [c?'c:'+c:null, n?'n:'+n:null].forEach(k=>{ if(!k) return; if(porChave[k]) pai[raiz(p.id)] = raiz(porChave[k]); else porChave[k]=p.id; });
  });
  const grupos = {};
  prods.forEach(p=>{ const r = raiz(p.id); (grupos[r]=grupos[r]||[]).push(p); });
  return Object.values(grupos).filter(g=>g.length>1);
}
function melhorDoGrupo(g){
  // fica o mais completo: com código, com foto, com preço; empate: o cadastrado primeiro
  const nota = p => (chaveCodigo(p.barcode)?4:0) + (p.photoBase64?2:0) + ((p.price||0)>0?1:0);
  return [...g].sort((a,b)=> nota(b)-nota(a) || String(a.createdAt||'').localeCompare(String(b.createdAt||'')))[0];
}
function abrirDuplicados(){
  const grupos = gruposDuplicados();
  if(!grupos.length){ showToast('✅ Nenhum produto repetido.'); closeModal(); renderContent(); return; }
  const linha = (p, gi, marcado) => `<label style="display:flex; gap:10px; align-items:center; padding:8px; border:1px solid #e3ddd0; border-radius:10px; margin:6px 0; cursor:pointer;">
      <input type="radio" name="dupG${gi}" value="${p.id}" ${marcado?'checked':''}>
      ${p.photoBase64?`<img class="prod-thumb" src="${p.photoBase64}">`:'<span class="prod-thumb-empty">📦</span>'}
      <span style="flex:1;"><b>${escapeHtml(p.name)}</b><br><span class="small-note">Código: ${escapeHtml(p.barcode||'—')} · Preço: ${brl(p.price)} · Custo: ${brl(p.cost)} · Estoque: <b>${p.stock||0}</b></span></span>
    </label>`;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal wide">
        <div class="flexbet"><h3>🧹 Produtos repetidos (${grupos.length})</h3><button class="btn btn-ghost btn-sm" onclick="closeModal()">Fechar ✕</button></div>
        <div class="small-note">Em cada grupo, marque o cadastro que <b>fica</b> (o preço dele é o que vale). O <b>estoque dos repetidos é somado</b> nele, e as vendas e movimentações antigas passam para ele. Antes de juntar, o sistema guarda uma cópia de segurança.</div>
        ${grupos.map((g,gi)=>{ const m = melhorDoGrupo(g); return `<div class="card" style="margin:12px 0; padding:12px;">

          <button class="btn btn-outline btn-sm" onclick="juntarGrupoDuplicado(${gi})">Juntar este grupo</button></div>
          ${g.map(p=>linha(p,gi,p.id===m.id)).join('')}</div>`; }).join('')}

function juntarEmMemoria(manter, repetidos){
  const ids = new Set(repetidos.map(p=>p.id));
  manter.stock = Math.round(([manter,...repetidos].reduce((s,p)=>s+(Number(p.stock)||0),0))*1000)/1000;
  for(const r of repetidos){
    if(!chaveCodigo(manter.barcode) && chaveCodigo(r.barcode)) manter.barcode = r.barcode;
    if(!manter.photoBase64 && r.photoBase64) manter.photoBase64 = r.photoBase64;
    if(!manter.brand && r.brand) manter.brand = r.brand;
    if(!manter.category && r.category) manter.category = r.category;
    if(!manter.supplierId && r.supplierId) manter.supplierId = r.supplierId;
    if(!(manter.cost>0) && r.cost>0) manter.cost = r.cost;
    manter.minStock = Math.max(Number(manter.minStock)||0, Number(r.minStock)||0);
  }
  (DB.movements||[]).forEach(m=>{ if(ids.has(m.productId)) m.productId = manter.id; });
  (DB.sales||[]).forEach(s=>(s.items||[]).forEach(i=>{ if(ids.has(i.productId)) i.productId = manter.id; }));
  DB.products = DB.products.filter(p=>!ids.has(p.id));
}
async function juntarGrupos(indices){
  const root = document.getElementById('modalRoot'), grupos = root._grupos||[];
  const escolhas = indices.map(gi=>{ const g = grupos[gi]; const sel = root.querySelector(`input[name="dupG${gi}"]:checked`);
    const manter = g.find(p=>p.id===(sel&&sel.value)) || melhorDoGrupo(g); return {manter, repetidos:g.filter(p=>p.id!==manter.id)}; });
  const total = escolhas.reduce((s,e)=>s+e.repetidos.length,0);
  if(!confirm('Juntar '+escolhas.length+' grupo(s)? '+total+' cadastro(s) repetido(s) serão juntados, somando o estoque. Uma cópia de segurança é guardada antes.')) return;
  try{ await fazerBackupAutomatico(true); }catch(e){}
  escolhas.forEach(e=>juntarEmMemoria(e.manter, e.repetidos));
  await Promise.all([saveKey(KEYS.products, DB.products), saveKey(KEYS.movements, DB.movements), saveKey(KEYS.sales, DB.sales)]);
  showToast('✅ Pronto: '+total+' cadastro(s) repetido(s) juntado(s). Estoque somado.', 6000);
  if(gruposDuplicados().length) abrirDuplicados(); else { closeModal(); renderContent(); }
}
function juntarGrupoDuplicado(gi){ return juntarGrupos([gi]); }

async function lerBarcodeCadastro(){
  if(!('BarcodeDetector' in window)){ showToast('Câmera de leitura não suportada neste navegador. Use o leitor USB ou digite manualmente.'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video = document.createElement('video'); video.srcObject=stream; video.play();
    const detector = new BarcodeDetector();
    const tryDetect = async ()=>{
      try{
        const codes = await detector.detect(video);
        if(codes.length){ document.getElementById('mBarcode').value = codes[0].rawValue; stream.getTracks().forEach(t=>t.stop()); showToast('Código lido!'); preencherPeloCodigo(true); return; }
      }catch(e){}
      stream.getVideoTracks()[0].readyState==='live' && requestAnimationFrame(tryDetect);
    };
    tryDetect();
    setTimeout(()=>{ if(stream.getVideoTracks()[0].readyState==='live') stream.getTracks().forEach(t=>t.stop()); }, 8000);
  }catch(e){ showToast('Não foi possível acessar a câmera.'); }
}
// ---------- Cadastro pelo código de barras: busca nome, marca, categoria e foto (grátis, Open Food Facts) ----------
// Nunca mexe em preço, custo ou estoque, e só preenche o que estiver vazio.
function categoriaPeloCodigo(prod){
  const t = ((prod.categories_tags||[]).filter(c=>!/foods-and-beverages/.test(c)).join(' ')+' '+(prod.product_type||'')+' '+(prod.product_name_pt||prod.product_name||'')).toLowerCase();
  const tem = re => re.test(t);
  if(tem(/beauty|shampoo|condicionador|sabonete|soap|toothpaste|creme dental|desodorante|deodorant|hygien|higien|absorvente|fralda/)) return 'Higiene e Beleza';
  if(tem(/clean|limpeza|detergent|deterg|desinfetante|amaciante|sabao em po|água sanitária|agua sanitaria/)) return 'Limpeza';
  if(tem(/petfood|pet-food|pet food|racao|ração|dog|cat-food/)) return 'Pet';
  if(tem(/beverage|bebida|drink|soda|refrigerante|juice|suco|water|agua|beer|cerveja|wine|vinho|coffee-drinks/)) return 'Bebidas';
  if(tem(/dairies|dairy|milk|leite|cheese|queijo|yogurt|iogurte|butter|manteiga|cream/)) return 'Laticínios';
  if(tem(/frozen|congelad|ice-cream|sorvete/)) return 'Congelados';
  if(tem(/meat|carne|sausage|salsicha|linguica|ham|presunto|chicken|frango|mortadela/)) return 'Carnes e Frios';
  if(tem(/bread|pao|pão|bakery|padaria|cake|bolo/)) return 'Padaria';
  if(tem(/chocolate|sweet|doce|candies|candy|biscuit|biscoito|cookie|snack|confection|wafer/)) return 'Doces e Biscoitos';
  if(tem(/fresh-fruits|fresh-vegetables|frutas frescas|verduras/)) return 'Hortifruti';
  return 'Mercearia';
}
function nomePeloCodigo(prod){
  let nome = String(prod.product_name_pt || prod.product_name || prod.generic_name_pt || '').trim().replace(/\s+/g,' ');
  if(!nome) return '';
  const q = String(prod.quantity||'').trim().replace(/\s+/g,'').replace(/^(\d+(?:[.,]\d+)?)(lt|l)$/i,'$1L');
  if(q && !chaveNome(nome).replace(/ /g,'').includes(chaveNome(q).replace(/ /g,''))) nome += ' ' + q;
  return nome.charAt(0).toUpperCase() + nome.slice(1);
}
async function preencherPeloCodigo(doLeitor){
  const campo = document.getElementById('mBarcode'); if(!campo) return;
  const st = document.getElementById('mCodigoStatus');
  const aviso = (txt)=>{ if(st) st.innerHTML = txt; };
  const codigo = (campo.value||'').replace(/\D/g,'');
  if(codigo.length < 8){ if(doLeitor) aviso('Código curto demais para buscar os dados.'); return; }
  const pid = campo.dataset.pid || '';
  const outro = DB.products.find(p=>p.id!==pid && chaveCodigo(p.barcode)===chaveCodigo(codigo));
  if(outro){ aviso(`❌ Esse código já é do produto <b>${escapeHtml(outro.name)}</b>. Não cadastre de novo.`); showToast('❌ Esse código já está cadastrado em "'+outro.name+'".', 7000); return; }
  if(campo.dataset.buscado === codigo) return;
  campo.dataset.buscado = codigo;
  aviso('⏳ Buscando os dados do produto pelo código...');
  try{
    const r = await fetch('https://world.openfoodfacts.org/api/v3/product/'+codigo+'.json?product_type=all&fields=product_name_pt,product_name,generic_name_pt,brands,quantity,categories_tags,image_front_url,image_url,product_type');
    const d = r.ok ? await r.json() : null;
    const prod = d && d.product;
    if(!prod || !(prod.product_name_pt||prod.product_name||prod.generic_name_pt)){
      aviso('Não achei esse código na base gratuita. Digite o nome e depois use <b>🔎 Achar foto sozinho</b>.');
      return;
    }
    const preenchidos = [];
    const pNome = document.getElementById('mNome'), pMarca = document.getElementById('mMarca'), pCat = document.getElementById('mCat');
    if(pNome && !pNome.value.trim()){ const n = nomePeloCodigo(prod); if(n){ pNome.value = n; preenchidos.push('nome'); } }
    if(pMarca && !pMarca.value.trim() && prod.brands){ pMarca.value = String(prod.brands).split(',')[0].trim(); preenchidos.push('marca'); }
    if(pCat && !pCat.value.trim()){ pCat.value = categoriaPeloCodigo(prod); preenchidos.push('categoria'); }
    const foto = prod.image_front_url || prod.image_url;
    if(foto && !document.getElementById('mFotoBase64').value){
      try{ await colocarFotoDoLink(foto); preenchidos.push('foto'); }catch(e){}
    }
    aviso(preenchidos.length
      ? '✅ Preenchi sozinho: <b>'+preenchidos.join(', ')+'</b>. Confira e coloque o <b>preço</b> e o <b>estoque</b>.'
      : '✅ Produto encontrado. Os campos já estavam preenchidos, não mudei nada.');
    const preco = document.getElementById('mPreco'); if(preco && !preco.value && preenchidos.length) preco.focus();
  }catch(e){
    campo.dataset.buscado = '';
    aviso('Sem internet agora. Preencha os dados à mão ou bipe de novo depois.');
  }
}

// Diminui a foto (no máximo 600px, JPG) para não pesar no sistema, no backup e no site.
function reduzirFoto(dataUrl, max){
  max = max || 600;
  return new Promise((ok, falha)=>{
    const img = new Image();
    img.onload = ()=>{
      const esc = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth*esc)), h = Math.max(1, Math.round(img.naturalHeight*esc));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); // fundo branco para PNG transparente
      ctx.drawImage(img, 0, 0, w, h);
      ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = ()=> falha(new Error('imagem'));
    img.src = dataUrl;
  });
}
function onProdutoFotoSelected(input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 25*1024*1024){ showToast('Imagem muito grande. Use um arquivo de até 25MB.'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{ mostrarFotoProduto(await reduzirFoto(e.target.result)); }
    catch(err){ showToast('Não foi possível ler essa imagem. Tente outro arquivo (JPG ou PNG).'); }
  };
  reader.readAsDataURL(file);
  input.value='';
}

  const nome = (document.getElementById('mNome').value||'').trim();
  const marca = (document.getElementById('mMarca').value||'').trim();
  if(!codigo && !nome){ showToast('Digite o código de barras ou o nome do produto primeiro.'); return; }
  const textoBtn = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Procurando...'; }
  try{
    let url = '', peloNome = false;
    if(codigo.length >= 8){
      const r = await fetch('https://world.openfoodfacts.org/api/v2/product/'+codigo+'.json?fields=image_front_url,image_url');
      if(r.ok){ const d = await r.json(); if(d && d.product) url = d.product.image_front_url || d.product.image_url || ''; }
    }
    let opcoes = [];
    if(!url && nome){
      // Pelo nome: usa as palavras principais (sem medidas) e prefere produto do Brasil.
      const tira = /^(kg|g|gr|ml|l|lt|un|und|unid|pct|pacote|cx|caixa|com|sem|tipo|de|da|do|das|dos|e|em)$/i;
      const pal = (nome+' '+marca).split(/[^0-9A-Za-zÀ-ÿ]+/).filter(w=>w.length>1 && !tira.test(w) && !/^\d/.test(w));
      const doBrasil = x => /^(789|790)/.test(String(x.code||'')) || (x.countries_tags||[]).some(c=>/brazil/.test(c));
      const tentativas = [pal.slice(0,4).join(' '), pal.slice(0,2).join(' ')].filter((q,i,arr)=>q && arr.indexOf(q)===i);
      const vistos = new Set();
      for(const q of tentativas){
        for(let vez=0; vez<3; vez++){
          try{
            const r = await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=24&fields=code,product_name,brands,image_front_url,image_front_small_url,countries_tags');
            if(r.ok){
              const lista = ((await r.json()).products||[]).filter(x=>x.image_front_url);
              // Ordena: mais palavras do nome batendo, começa com a 1ª palavra (ex.: "arroz"), e do Brasil.
              const pn = pal.map(normalizarBusca);
              const nota = x => { const n0 = normalizarBusca(x.product_name||'').trim(), mb = normalizarBusca(x.brands||'');
                return pn.reduce((t,w)=> t + (n0.includes(w) ? 3 : (mb.includes(w) ? 1 : 0)), 0) + (pn[0] && n0.startsWith(pn[0]) ? 3 : 0) + (doBrasil(x)?1:0); };
              lista.sort((x,y)=>nota(y)-nota(x));
              for(const x of lista){ if(!vistos.has(x.image_front_url) && opcoes.length<8){ vistos.add(x.image_front_url); opcoes.push({grande:x.image_front_url, pequena:x.image_front_small_url||x.image_front_url}); } }
              break;
            }
          }catch(e){}
          await new Promise(ok=>setTimeout(ok,1500)); // site ocupado: espera um pouco e tenta de novo
        }
        if(opcoes.length>=4) break;
      }
      if(opcoes.length){ url = opcoes[0].grande; peloNome = true; }
    }
    if(!url){ showToast('Não achei foto para este produto. Use "Procurar no Google Imagens".', 6000); return; }
    await colocarFotoDoLink(url);
    mostrarOpcoesFoto(opcoes);
    showToast(peloNome ? (opcoes.length>1 ? 'Coloquei a 1ª foto. Se não for a certa, toque em outra logo abaixo. Depois clique em Salvar.' : 'Foto encontrada pelo nome. Confira e clique em Salvar.') : 'Foto encontrada! Confira e clique em Salvar.', 7000);
  }catch(err){
    showToast('Não consegui buscar a foto agora. Confira a internet e tente de novo.', 6000);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = textoBtn; }
  }
}

function mostrarOpcoesFoto(opcoes){

function abrirGoogleImagens(){

  let q = nome ? (nome + (marca && !normalizarBusca(nome).includes(normalizarBusca(marca)) ? ' '+marca : '')) : codigo;
  if(!q){ showToast('Digite o nome do produto primeiro.'); return; }
  window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q), '_blank');
  showToast('No Google: botão direito na foto > Copiar imagem. Depois volte aqui e aperte Ctrl+V.', 8000);

function blobParaDataUrl(blob){
  return new Promise((ok, falha)=>{ const fr = new FileReader(); fr.onload = ()=>ok(fr.result); fr.onerror = falha; fr.readAsDataURL(blob); });
}
async function usarBlobFoto(blob){
  try{ mostrarFotoProduto(await reduzirFoto(await blobParaDataUrl(blob))); showToast('Foto colocada! Confira e clique em Salvar.'); return true; }
  catch(e){ showToast('Não consegui ler essa imagem. Tente copiar outra foto.'); return false; }
}
async function usarLinkFoto(url){
  if(!/^(https?:|data:image\/)/i.test(url||'')) return false;
  try{
    if(/^data:image\//i.test(url)){ mostrarFotoProduto(await reduzirFoto(url)); showToast('Foto colocada! Confira e clique em Salvar.'); return true; }
    const r = await fetch(url); if(!r.ok) throw new Error('foto');
    const b = await r.blob(); if(!/^image\//.test(b.type)) throw new Error('tipo');
    return await usarBlobFoto(b);
  }catch(e){
    showToast('Esse site não deixa puxar a foto assim. No Google, use botão direito > Copiar imagem e aperte Ctrl+V aqui.', 9000);
    return false;
  }
}
async function colarFotoProduto(){
  try{
    const itens = await navigator.clipboard.read();
    for(const it of itens){
      const tipo = it.types.find(t=>t.startsWith('image/'));
      if(tipo){ await usarBlobFoto(await it.getType(tipo)); return; }
    }
    for(const it of itens){
      if(it.types.includes('text/plain')){ const t = (await (await it.getType('text/plain')).text()).trim(); if(await usarLinkFoto(t)) return; }
    }
    showToast('Não achei foto copiada. No Google: botão direito na foto > Copiar imagem.', 7000);
  }catch(e){
    showToast('Aperte Ctrl+V aqui na tela do produto para colar a foto.', 6000);
  }
}
document.addEventListener('paste', async (ev)=>{
  if(!document.getElementById('prodFotoPreview') || !ev.clipboardData) return;
  const arq = Array.from(ev.clipboardData.items||[]).find(i=>i.kind==='file' && i.type.startsWith('image/'));
  if(arq){ ev.preventDefault(); await usarBlobFoto(arq.getAsFile()); return; }
  const alvo = ev.target, emCampo = alvo && (alvo.tagName==='INPUT' || alvo.tagName==='TEXTAREA');
  const html = ev.clipboardData.getData('text/html') || '';
  const m = html.match(/<img[^>]+src="([^"]+)"/i);
  if(m && !emCampo){ ev.preventDefault(); await usarLinkFoto(m[1].replace(/&amp;/g,'&')); }
});
document.addEventListener('dragover', (ev)=>{ if(document.getElementById('prodFotoPreview')) ev.preventDefault(); });
document.addEventListener('drop', async (ev)=>{
  if(!document.getElementById('prodFotoPreview')) return;
  ev.preventDefault();
  const dt = ev.dataTransfer; if(!dt) return;
  const f = Array.from(dt.files||[]).find(x=>x.type.startsWith('image/'));
  if(f){ await usarBlobFoto(f); return; }
  const html = dt.getData('text/html') || '';
  const m = html.match(/<img[^>]+src="([^"]+)"/i);
  const link = m ? m[1].replace(/&amp;/g,'&') : (dt.getData('text/uri-list')||dt.getData('text/plain')||'').split('\n')[0].trim();
  if(link) await usarLinkFoto(link);
});

async function saveProduct(id){
  const name = document.getElementById('mNome').value.trim();
  const brand = document.getElementById('mMarca').value.trim();
  const category = document.getElementById('mCat').value.trim();
  const supplierId = document.getElementById('mFornecedor').value;
  const barcode = document.getElementById('mBarcode').value.trim();
  const saleType = document.getElementById('mSaleType').value;
  const cost = parseFloat(document.getElementById('mCusto').value)||0;
  const price = parseFloat(document.getElementById('mPreco').value)||0;
  const stock = parseFloat(document.getElementById('mEstoque').value)||0;
  const minStock = parseFloat(document.getElementById('mMin').value)||0;
  const photoBase64 = document.getElementById('mFotoBase64').value || null;
  if(!name || price<=0){ showToast('Informe ao menos o nome e o preço de venda.'); return; }
  const mesmoCodigo = barcode && chaveCodigo(barcode) ? DB.products.find(p=>p.id!==id && chaveCodigo(p.barcode)===chaveCodigo(barcode)) : null;
  if(mesmoCodigo){ showToast('❌ Não é permitido cadastro duplicado. Esse código de barras já é do produto "'+mesmoCodigo.name+'". Abra esse produto para editar.', 9000); return; }
  const nomeNorm = chaveNome(name);
  const duplicado = DB.products.find(p=>chaveNome(p.name)===nomeNorm && p.id!==id);
  if(duplicado){
    showToast('❌ Não é permitido cadastro duplicado. Já existe um produto chamado "'+duplicado.name+'" (estoque atual: '+duplicado.stock+'). Se for o mesmo produto, cancele e use "Estoque → Entrada de Mercadoria" para somar a quantidade. Se for um produto diferente, mude o nome (ex: inclua marca, tamanho ou variação) antes de salvar.', 9000);
    return;
  }
  let novoProdutoCriado = null;
  if(id){
    const p = DB.products.find(x=>x.id===id);
    Object.assign(p, {name, brand, category, supplierId, barcode, saleType, cost, price, stock, minStock, photoBase64});
  }else{
    novoProdutoCriado = {id:uid(), name, brand, category, supplierId, barcode, saleType, cost, price, stock, minStock, photoBase64, createdAt:nowISO()};
    DB.products.push(novoProdutoCriado);
  }
  await saveKey(KEYS.products, DB.products);
  if(novoProdutoCriado && nfAguardandoCadastroIdx!==null && nfConferencia){
    nfProdutoCadastrado(novoProdutoCriado);
    closeModal(); showToast('✅ Produto cadastrado e ligado ao item da nota.'); renderContent();
  }else if(novoProdutoCriado && aguardandoNovoProdutoEntrada){
    aguardandoNovoProdutoEntrada = false;
    selecionarProdutoAoRenderizarMov = novoProdutoCriado.id;
    closeModal(); showToast('✅ Produto cadastrado! Agora é só informar a quantidade da entrada.'); renderContent();
    setTimeout(()=>{ const q=document.getElementById('movQtd'); if(q) q.focus(); }, 60);
  }else{
    closeModal(); showToast('Produto salvo com sucesso.'); renderContent();
  }
}

function onImportarProdutosSelected(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let lista;
    try{
      lista = JSON.parse(e.target.result);
      if(!Array.isArray(lista)) throw new Error('não é uma lista');
    }catch(err){
      let parsedObj = null;
      try{ parsedObj = JSON.parse(e.target.result); }catch(e2){ /* ignora */ }
      if(parsedObj && typeof parsedObj==='object' && Array.isArray(parsedObj.products)){
        showToast('⚠️ Este arquivo é um BACKUP COMPLETO do sistema (não uma lista simples de produtos). Para importar só produtos, use um arquivo de produtos. Para restaurar esse backup completo, use o botão "⬆️ Restaurar backup (JSON)" em Configurações.', 9000);
      }else{
        showToast('Arquivo inválido: precisa ser uma lista de produtos em JSON.');
      }
      input.value=''; return;
    }
    if(!confirm('Isso vai importar '+lista.length+' produto(s), mesclando com o cadastro atual (atualiza pelo código de barras, sem apagar nada mais). Deseja continuar?')){
      input.value=''; return;
    }
    let novos=0, atualizados=0, ignorados=0;
    lista.forEach(item=>{
      const name = (item.name||item.nome||'').toString().trim();
      const price = parseFloat(item.price ?? item.preco);
      if(!name || !price || price<=0){ ignorados++; return; }
      const barcode = (item.barcode||item.codigo||'').toString().trim();
      const cost = parseFloat(item.cost ?? item.custo) || 0;
      const stock = parseFloat(item.stock ?? item.estoque) || 0;
      const category = (item.category||item.categoria||'').toString().trim();
      const brand = (item.brand||item.marca||'').toString().trim();
      const saleType = (item.saleType==='peso' || (item.und||'').toString().toUpperCase()==='KG') ? 'peso' : 'unidade';
      const existente = (chaveCodigo(barcode) ? DB.products.find(p=>chaveCodigo(p.barcode)===chaveCodigo(barcode)) : null)
        || DB.products.find(p=>chaveNome(p.name)===chaveNome(name));
      if(existente){
        existente.cost = cost || existente.cost;
        existente.price = price;
        existente.stock = stock;
        if(category) existente.category = category;
        if(brand) existente.brand = brand;
        if(barcode) existente.barcode = existente.barcode || barcode;
        existente.saleType = saleType;
        atualizados++;
      }else{
        DB.products.push({
          id: uid(), name, brand, category, supplierId:'', barcode, saleType,
          cost, price, stock, minStock: parseFloat(item.minStock ?? item.estoqueMinimo) || 0,
          createdAt: nowISO()
        });
        novos++;
      }
    });
    await saveKey(KEYS.products, DB.products);
    showToast(`✅ Importação concluída: ${novos} novo(s), ${atualizados} atualizado(s)${ignorados?', '+ignorados+' ignorado(s) por dado incompleto':''}.`, 6000);
    input.value='';
    renderContent();
  };
  reader.readAsText(file);
}

async function saveClient(id){
  const name = document.getElementById('clNome').value.trim();
  const cpf = document.getElementById('clCpf').value.trim();
  const cnpj = document.getElementById('clCnpj').value.trim();
  const celular = document.getElementById('clCelular').value.trim();
  const telefone = document.getElementById('clTelefone').value.trim();
  const email = document.getElementById('clEmail').value.trim();
  const endereco = document.getElementById('clEndereco').value.trim();
  const limiteCredito = parseFloat(document.getElementById('clLimite').value)||0;
  const observacoes = document.getElementById('clObs').value.trim();
  if(!name){ showToast('Informe o nome do cliente.'); return; }
  if(id){
    const c = DB.clients.find(function(x){return x.id===id;});
    Object.assign(c, {name:name, cpf:cpf, cnpj:cnpj, celular:celular, telefone:telefone, email:email, endereco:endereco, limiteCredito:limiteCredito, observacoes:observacoes});
  }else{
    DB.clients.push({id:uid(), name:name, cpf:cpf, cnpj:cnpj, celular:celular, telefone:telefone, email:email, endereco:endereco, limiteCredito:limiteCredito, observacoes:observacoes, saldoDevedor:0, createdAt:nowISO()});
  }
  await saveKey(KEYS.clients, DB.clients);
  closeModal(); showToast('Cliente salvo com sucesso.'); renderContent();
}
async function deleteClient(id){
  const c = DB.clients.find(function(x){return x.id===id;});
  if(c && c.saldoDevedor>0){ showToast('Este cliente tem saldo devedor em aberto. Quite o fiado antes de excluir.'); return; }
  if(!confirm('Tem certeza que deseja excluir este cliente?')) return;
  DB.clients = DB.clients.filter(function(x){return x.id!==id;});
  await saveKey(KEYS.clients, DB.clients);
  renderContent();
}

async function confirmarRecebimento(clientId){
  const c = DB.clients.find(function(x){return x.id===clientId;});
  if(!c) return;
  const valor = parseFloat(document.getElementById('pgValor').value);
  const forma = document.getElementById('pgForma').value;
  if(!valor || valor<=0){ showToast('Informe um valor válido.'); return; }
  c.saldoDevedor = Math.max(0, c.saldoDevedor - valor);
  DB.lancamentos.push({id:uid(), type:'entrada', category:'Recebimento fiado', value:valor, paymentMethod:forma, description:'Pagamento de '+c.name+' ('+forma+')', clientId:clientId, operator:operatorName, date:nowISO()});
  await Promise.all([saveKey(KEYS.clients, DB.clients), saveKey(KEYS.lancamentos, DB.lancamentos)]);
  closeModal();
  showToast('✅ Pagamento de '+brl(valor)+' registrado! Novo saldo de '+c.name+': '+brl(c.saldoDevedor)+'. Já entrou no caixa e nos relatórios.');
  renderContent();
}
function verHistoricoFiadoModal(clientId){
  const c = DB.clients.find(function(x){return x.id===clientId;});
  if(!c) return;
  const vendas = DB.sales.filter(function(s){return s.clientId===clientId;}).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  const pagamentos = DB.lancamentos.filter(function(l){
    return l.category==='Recebimento fiado' && (l.clientId===clientId || (!l.clientId && l.description && l.description.indexOf(c.name)>-1));
  }).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  const totalComprado = vendas.reduce(function(a,s){return a+s.total;},0);
  const totalPago = pagamentos.reduce(function(a,l){return a+l.value;},0);
  const linhasVendas = vendas.length===0 ? '<div class="empty-state">Nenhuma venda fiado registrada para este cliente.</div>' :
    '<table><thead><tr><th>Data</th><th>Itens</th><th class="right">Valor</th></tr></thead><tbody>'
    + vendas.map(function(s){
        return '<tr><td class="muted">'+fmtDate(s.date)+'</td><td>'+s.items.map(function(i){return escapeHtml(i.name)+' x'+i.qty;}).join(', ')+'</td><td class="right">'+brl(s.total)+'</td></tr>';
      }).join('')
    + '</tbody></table>';
  const linhasPagamentos = pagamentos.length===0 ? '<div class="empty-state">Nenhum pagamento recebido ainda deste cliente.</div>' :
    '<table><thead><tr><th>Data</th><th>Forma</th><th class="right">Valor</th></tr></thead><tbody>'
    + pagamentos.map(function(l){
        return '<tr><td class="muted">'+new Date(l.date).toLocaleDateString('pt-BR')+'</td><td>'+escapeHtml(labelFormaPagamento(l.paymentMethod||'dinheiro'))+'</td><td class="right">'+brl(l.value)+'</td></tr>';
      }).join('')
    + '</tbody></table>';
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal wide">'
    + '<h3>📒 Histórico de fiado — '+escapeHtml(c.name)+'</h3>'
    + '<div class="stat-row" style="margin-bottom:14px;">'
    + '<div class="stat"><div class="lbl">Total comprado no fiado</div><div class="val" style="font-size:18px;">'+brl(totalComprado)+'</div></div>'
    + '<div class="stat"><div class="lbl">Total já pago</div><div class="val" style="font-size:18px;">'+brl(totalPago)+'</div></div>'
    + '<div class="stat '+(c.saldoDevedor>0?'bad':'')+'"><div class="lbl">Saldo devedor atual</div><div class="val" style="font-size:18px;">'+brl(c.saldoDevedor)+'</div></div>'
    + '</div>'
    + '<h4 style="margin:10px 0 6px;">Compras fiado</h4>' + linhasVendas
    + '<h4 style="margin:16px 0 6px;">Pagamentos recebidos</h4>' + linhasPagamentos
    + '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Fechar</button></div>'
    + '</div></div>';
}

/* ================================================================
   BACKUP AUTOMÁTICO (cópias internas + pasta opcional) e VALIDAÇÃO
   ----------------------------------------------------------------
   - A cada alteração os dados já são gravados no navegador (modo estrito,
     resistente a queda de energia).
   - Além disso, a cada poucos minutos (se houve alteração) o sistema guarda
     uma CÓPIA COMPLETA dentro do próprio navegador: as 10 últimas + a última
     de cada dia (10 dias). Tudo comprimido.
   - Opcional: escolher uma pasta do computador; o sistema grava lá um arquivo
     por dia (backup-auto-fcosta-AAAA-MM-DD.json), que sobrevive até se o
     navegador for limpo.
   - Se o sistema abrir VAZIO e existir cópia automática, oferece restaurar.
   ================================================================ */
const AUTO_META_KEY = 'pc_auto_meta';
const AUTO_DIR_KEY  = 'pc_auto_dirhandle';
const AUTO_INTERVALO_MS = 3*60*1000;
const AUTO_LIMITES = { auto:10, dia:10, seguranca:3, protegida:3 };
let _autoPausado = false;
const AUTO_LISTAS = ['products','movements','sales','caixaSessions','lancamentos','contas','suppliers','clients','employees'];
let _autoSujo = false, _autoVersao = 0, _autoMetaCache = [], _dirHandle = null;
let _autoStatus = { ultimoEm:null, erro:null, pasta:'nenhuma' }; // pasta: nenhuma | ok | permissao | erro
let _autoFila = Promise.resolve();
function marcarAlterado(){ _autoSujo = true; _autoVersao++; }
function enfileirarAuto(fn){ const p = _autoFila.then(fn, fn); _autoFila = p.catch(()=>{}); return p; }

function contarDados(o){
  o = o||{};
  const n = k => Array.isArray(o[k]) ? o[k].length : 0;
  return { produtos:n('products'), vendas:n('sales'), clientes:n('clients'), movimentos:n('movements'), financeiro:n('lancamentos')+n('contas') };
}
function totalRegistros(o){ return AUTO_LISTAS.reduce((t,k)=>t+(Array.isArray(o[k])?o[k].length:0),0); }
function temDadosNoDB(){ return totalRegistros(DB) > 0; }
function fmtResumoDados(r){
  return r.produtos+' produto(s), '+r.vendas+' venda(s), '+r.clientes+' cliente(s), '+r.movimentos+' mov. de estoque';
}
function validarBackup(data){
  if(!data || typeof data!=='object' || Array.isArray(data) || !Array.isArray(data.products))
    return { ok:false, erro:'Arquivo inválido: não parece ser um backup completo deste sistema.' };
  for(const k of AUTO_LISTAS){
    if(data[k]!==undefined && !Array.isArray(data[k]))
      return { ok:false, erro:'Backup danificado: o campo "'+k+'" está em formato inválido. Restauração cancelada.' };
  }
  if(totalRegistros(data)===0)
    return { ok:false, erro:'Este backup está VAZIO (sem produtos, vendas, clientes etc.). Restaurá-lo apagaria seus dados atuais sem trazer nada. Restauração cancelada.' };
  return { ok:true, resumo:contarDados(data) };
}

/* compressão (gzip) para as cópias internas — cai para texto puro se o navegador não suportar */
async function empacotarTexto(txt){
  try{
    if(typeof CompressionStream==='function'){
      const buf = await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
      return { fmt:'gz', data:buf };
    }
  }catch(e){ /* usa texto puro */ }
  return { fmt:'txt', data:txt };
}
async function desempacotarTexto(reg){
  if(!reg) throw new Error('Cópia não encontrada');
  if(reg.fmt==='gz'){
    return await new Response(new Blob([reg.data]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  return reg.data;
}
async function lerAutoMeta(){
  try{ const v = await idbGet(AUTO_META_KEY); return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
async function gravarAutoMeta(m){ _autoMetaCache = m; await idbSet(AUTO_META_KEY, JSON.stringify(m)); }

/* grava uma cópia completa do estado atual. tipos: 'auto' (rolante), 'dia' (última do dia), 'seguranca' (antes de restaurar) */
async function gravarSnapshot(tipos){
  const obj = montarBackupJSON();
  const txt = JSON.stringify(obj);
  const resumo = contarDados(obj);
  const reg = await empacotarTexto(txt);
  const agora = Date.now(), dia = todayISODate();
  let meta = await lerAutoMeta();
  const novasChaves = [];
  for(const t of tipos){
    const key = t==='dia' ? 'pc_auto_dia_'+dia : 'pc_auto_'+t+'_'+agora;
    await idbSet(key, reg);
    meta = meta.filter(e=>e.key!==key);
    meta.push({ key, tipo:t, at:agora, resumo, dia });
    novasChaves.push(key);
  }
  // limpeza: mantém só os mais recentes de cada tipo
  for(const t of Object.keys(AUTO_LIMITES)){
    const doTipo = meta.filter(e=>e.tipo===t).sort((a,b)=>b.at-a.at);
    for(const velho of doTipo.slice(AUTO_LIMITES[t])){
      if(novasChaves.includes(velho.key)) continue;
      try{ await idbDelete(velho.key); }catch(e){}
      meta = meta.filter(e=>e.key!==velho.key);
    }
  }
  await gravarAutoMeta(meta);
  return txt;
}

async function escreverNaPasta(txt, dia){
  if(!_dirHandle){ _autoStatus.pasta='nenhuma'; return; }
  try{
    const perm = await _dirHandle.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){ _autoStatus.pasta='permissao'; return; }
    const fh = await _dirHandle.getFileHandle('backup-auto-fcosta-'+dia+'.json', {create:true});
    const w = await fh.createWritable();   // grava num arquivo temporário e só troca ao fechar (não corrompe se cair a energia)
    await w.write(txt);
    await w.close();
    _autoStatus.pasta = 'ok';
    // mantém só os 14 arquivos mais recentes na pasta
    const nomes = [];
    for await (const [nome] of _dirHandle.entries()){
      if(/^backup-auto-fcosta-\d{4}-\d{2}-\d{2}\.json$/.test(nome)) nomes.push(nome);
    }
    nomes.sort();
    for(const velho of nomes.slice(0, Math.max(0, nomes.length-14))){
      try{ await _dirHandle.removeEntry(velho); }catch(e){}
    }
  }catch(e){
    console.error('Backup na pasta falhou', e);
    _autoStatus.pasta = 'erro';
  }
}

function fazerBackupAutomatico(forcar){
  return enfileirarAuto(async ()=>{
    if(!forcar && !_autoSujo) return;
    if(_autoPausado && !forcar) return;   // aguardando decisão sobre possível perda de dados
    if(!temDadosNoDB()) return;          // nunca guarda cópia "vazia"
    const versao = _autoVersao;
    try{
      const txt = await gravarSnapshot(['auto','dia']);
      await escreverNaPasta(txt, todayISODate());
      if(_autoVersao===versao) _autoSujo = false;
      _autoStatus.ultimoEm = Date.now(); _autoStatus.erro = null;
    }catch(e){
      console.error('Backup automático falhou', e);
      _autoStatus.erro = String(e && e.message || e);
    }
    atualizarUIAutoBackup();
  });
}

function fmtDataHoraAuto(ms){
  const d = new Date(ms);
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function atualizarUIAutoBackup(){
  const b = document.getElementById('autoBackupBadge');
  if(b){
    if(_autoStatus.erro){ b.style.display='inline-flex'; b.style.background='rgba(178,64,47,0.3)'; b.style.color='#ffb3a3'; b.textContent='⚠️ Backup automático falhou'; }
    else if(_autoStatus.ultimoEm){ b.style.display='inline-flex'; b.style.background=''; b.style.color=''; b.textContent='💾 Cópia automática '+new Date(_autoStatus.ultimoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
    else b.style.display='none';
  }
  const box = document.getElementById('autoBackupBox');
  if(box) box.innerHTML = renderAutoBackupBox();
}
function renderAutoBackupBox(){
  const meta = [..._autoMetaCache].sort((a,b)=>b.at-a.at);
  const nomeTipo = {auto:'Automática', dia:'Fim do dia', seguranca:'Antes de restaurar', protegida:'Protegida (antes de perda)'};
  const linhas = meta.map(e=>`
    <tr>
      <td>${nomeTipo[e.tipo]||e.tipo}</td>
      <td>${fmtDataHoraAuto(e.at)}</td>
      <td class="muted">${e.resumo ? escapeHtml(fmtResumoDados(e.resumo)) : ''}</td>
      <td style="text-align:right;"><button class="btn btn-outline btn-sm" onclick="restaurarCopiaAutomatica('${e.key}')">Restaurar</button></td>
    </tr>`).join('');
  let pastaHtml;
  if(!window.showDirectoryPicker){
    pastaHtml = '<div class="small-note">Seu navegador não permite gravar numa pasta do computador. Use o <strong>Google Chrome</strong> ou o <strong>Microsoft Edge</strong> para ter esse recurso.</div>';
  }else if(_autoStatus.pasta==='ok'){
    pastaHtml = `<div class="small-note">📁 Pasta de backup: <strong style="color:var(--verde,#2f6b3a)">ativa</strong> (nome da pasta: <strong>${escapeHtml(_dirHandle&&_dirHandle.name||'')}</strong>). Um arquivo por dia é atualizado lá automaticamente.</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:6px;" onclick="escolherPastaBackup()">Trocar pasta</button>`;
  }else if(_autoStatus.pasta==='permissao'){
    pastaHtml = `<div class="small-note" style="color:var(--vermelho)">📁 O navegador precisa da sua permissão novamente para gravar na pasta <strong>${escapeHtml(_dirHandle&&_dirHandle.name||'')}</strong>.</div>
      <button class="btn btn-primary btn-sm" style="margin-top:6px;" onclick="reativarPastaBackup()">Permitir gravar na pasta</button>
      <button class="btn btn-ghost btn-sm" style="margin-top:6px;" onclick="escolherPastaBackup()">Trocar pasta</button>`;
  }else if(_autoStatus.pasta==='erro'){
    pastaHtml = `<div class="small-note" style="color:var(--vermelho)">📁 Não consegui gravar na pasta (pode estar cheia, removida ou sem permissão).</div>
      <button class="btn btn-primary btn-sm" style="margin-top:6px;" onclick="escolherPastaBackup()">Escolher outra pasta</button>`;
  }else{
    pastaHtml = `<div class="small-note">📁 <strong>Recomendado:</strong> escolha uma pasta do computador (ex.: crie uma pasta <span class="mono">Backup FCosta</span> em Documentos ou num pen-drive) para o sistema gravar uma cópia por dia fora do navegador.</div>
      <button class="btn btn-primary btn-sm" style="margin-top:6px;" onclick="escolherPastaBackup()">📁 Escolher pasta de backup</button>`;
  }
  return `
    <div class="small-note" style="margin-bottom:8px;">
      O sistema guarda <strong>cópias automáticas</strong> dentro do navegador a cada ${AUTO_INTERVALO_MS/60000} minutos (quando há alterações) — as 10 últimas e a última de cada dia.
      ${_autoStatus.ultimoEm ? 'Última cópia: <strong>'+fmtDataHoraAuto(_autoStatus.ultimoEm)+'</strong>.' : 'Ainda não houve cópia nesta sessão.'}
      ${_autoStatus.erro ? '<br><strong style="color:var(--vermelho)">Erro: '+escapeHtml(_autoStatus.erro)+'</strong>' : ''}
    </div>
    ${pastaHtml}
    <div style="margin-top:12px;">
      <button class="btn btn-outline btn-sm" onclick="fazerBackupAutomatico(true).then(()=>showToast('Cópia automática feita agora.'))">Fazer cópia agora</button>
    </div>
    ${meta.length ? `<div style="overflow-x:auto; margin-top:10px;"><table><thead><tr><th>Tipo</th><th>Data e hora</th><th>Conteúdo</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>` : ''}`;
}
async function escolherPastaBackup(){
  if(!window.showDirectoryPicker){ showToast('Seu navegador não permite escolher pasta. Use Chrome ou Edge.', 5000); return; }
  try{
    const h = await window.showDirectoryPicker({ mode:'readwrite', id:'fcosta-backup' });
    _dirHandle = h;
    await idbSet(AUTO_DIR_KEY, h);
    _autoStatus.pasta = 'ok';
    await fazerBackupAutomatico(true);
    atualizarUIAutoBackup();
    showToast(_autoStatus.pasta==='ok' ? '✅ Pasta de backup configurada.' : 'Pasta escolhida, mas não consegui gravar nela. Tente outra pasta.', 5000);
  }catch(e){
    if(e && e.name==='AbortError') return;
    console.error(e);
    showToast('Não foi possível usar essa pasta. Crie uma pasta nova (ex.: "Backup FCosta") e escolha-a. O Chrome não aceita Downloads/Documentos diretamente.', 8000);
  }
}
async function reativarPastaBackup(){
  try{
    const r = await _dirHandle.requestPermission({mode:'readwrite'});
    if(r==='granted'){ await fazerBackupAutomatico(true); }
    else showToast('Permissão negada.');
  }catch(e){ console.error(e); showToast('Não foi possível reativar a pasta. Escolha-a novamente.'); }
  atualizarUIAutoBackup();
}

async function lerCopiaAutomatica(key){
  const reg = await idbGet(key);
  const txt = await desempacotarTexto(reg);
  const data = JSON.parse(txt);
  const v = validarBackup(data);
  if(!v.ok) throw new Error(v.erro);
  return { data, resumo:v.resumo };
}
async function restaurarCopiaAutomatica(key){
  let info;
  try{ info = await lerCopiaAutomatica(key); }
  catch(e){ showToast('Essa cópia está danificada e não pode ser usada: '+(e.message||e), 8000); return; }
  const e = _autoMetaCache.find(x=>x.key===key);
  const atual = contarDados(DB);
  if(!confirm('Restaurar a cópia de '+(e?fmtDataHoraAuto(e.at):'?')+'?\n\nDados ATUAIS: '+fmtResumoDados(atual)+'\nDados da CÓPIA: '+fmtResumoDados(info.resumo)+'\n\nOs dados atuais serão substituídos (uma cópia "Antes de restaurar" é guardada antes). Continuar?')) return;
  await aplicarBackupNoSistema(info.data, true);
}
/* aplica um backup já validado. guardarCopia=true guarda antes uma cópia interna dos dados atuais */
async function aplicarBackupNoSistema(data, guardarCopia){
  _autoPausado = false;
  if(guardarCopia && temDadosNoDB()){
    try{ await enfileirarAuto(()=>gravarSnapshot(['seguranca'])); }catch(e){ console.error(e); }
  }
  DB.products = data.products||[];
  DB.movements = data.movements||[];
  DB.sales = data.sales||[];
  DB.caixaSessions = data.caixaSessions||[];
  DB.lancamentos = data.lancamentos||[];
  DB.contas = data.contas||[];
  DB.suppliers = data.suppliers||[];
  DB.clients = data.clients||[];
  DB.employees = data.employees||[];
  DB.settings = data.settings||DB.settings;
  if(!DB.settings.operadores || !DB.settings.operadores.length) DB.settings.operadores=['Caixa 1'];
  if(DB.settings.saldoInicialCaixa===undefined) DB.settings.saldoInicialCaixa = 0;
  if(!DB.settings.saldoInicialData) DB.settings.saldoInicialData = todayISODate();
  await Promise.all([
    saveKey(KEYS.products, DB.products), saveKey(KEYS.movements, DB.movements),
    saveKey(KEYS.sales, DB.sales), saveKey(KEYS.caixaSessions, DB.caixaSessions),
    saveKey(KEYS.lancamentos, DB.lancamentos), saveKey(KEYS.contas, DB.contas), saveKey(KEYS.suppliers, DB.suppliers),
    saveKey(KEYS.clients, DB.clients), saveKey(KEYS.employees, DB.employees), saveKey(KEYS.settings, DB.settings)
  ]);
  fillOperatorSelect(); renderNav(); renderContent();
  showToast('✅ Dados restaurados com sucesso!', 6000);
  fazerBackupAutomatico(true);
}

/* Compara o que foi carregado agora com a última cópia automática. Se faltarem muitos registros
   (ex.: o navegador leu uma reserva antiga), protege a melhor cópia e oferece restaurar. */
function detectarPerdaNaAbertura(){
  const refs = _autoMetaCache.filter(e=>e.resumo && e.tipo!=='seguranca').sort((a,b)=>b.at-a.at);
  if(!refs.length) return null;
  const atual = contarDados(DB);
  // melhor referência = a recente com mais registros (evita comparar com uma cópia que já estava incompleta)
  const recentes = refs.slice(0,6);
  const ref = recentes.reduce((m,e)=> (e.resumo.vendas+e.resumo.movimentos+e.resumo.produtos) > (m.resumo.vendas+m.resumo.movimentos+m.resumo.produtos) ? e : m, recentes[0]);
  const caiu = (k,minDif)=> (ref.resumo[k]-atual[k])>=minDif && atual[k] < ref.resumo[k]*0.9;
  if(caiu('vendas',20) || caiu('movimentos',20) || caiu('produtos',20)) return { ref, atual };
  return null;
}
async function protegerCopia(entry){
  try{
    const reg = await idbGet(entry.key);
    const key = 'pc_auto_prot_'+Date.now();
    await idbSet(key, reg);
    const meta = await lerAutoMeta();
    meta.push({ key, tipo:'protegida', at:entry.at, resumo:entry.resumo, dia:entry.dia });
    const prot = meta.filter(e=>e.tipo==='protegida').sort((a,b)=>b.at-a.at);
    for(const velho of prot.slice(AUTO_LIMITES.protegida)){ try{ await idbDelete(velho.key); }catch(e){} meta.splice(meta.indexOf(velho),1); }
    await gravarAutoMeta(meta);
    return key;
  }catch(e){ console.error('Falha ao proteger cópia', e); return null; }
}
async function verificarPerdaNaAbertura(){
  const perda = detectarPerdaNaAbertura();
  if(!perda) return;
  _autoPausado = true;                       // não deixa cópias novas (incompletas) substituírem as boas
  const chave = await protegerCopia(perda.ref);
  const r = perda.ref.resumo, a = perda.atual;
  const msg = '⚠️ ATENÇÃO: os dados carregados parecem INCOMPLETOS.\n\n'
    + 'Agora no sistema: '+fmtResumoDados(a)+'\n'
    + 'Na última cópia automática ('+fmtDataHoraAuto(perda.ref.at)+'): '+fmtResumoDados(r)+'\n\n'
    + 'Isso pode acontecer quando o navegador não consegue ler tudo. Deseja RESTAURAR essa cópia agora?\n'
    + '(OK = restaurar a cópia / Cancelar = continuar com os dados atuais)';
  if(confirm(msg) && chave){
    try{
      const info = await lerCopiaAutomatica(chave);
      await aplicarBackupNoSistema(info.data, true);
      return;
    }catch(e){ showToast('Não consegui ler essa cópia: '+(e.message||e), 8000); }
  }
  _autoPausado = false;
  showToast('Cópia anterior guardada como "Protegida" em Cadastros → Backup, caso precise depois.', 8000);
}

async function iniciarBackupAutomatico(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  _autoMetaCache = await lerAutoMeta();
  try{
    const h = await idbGet(AUTO_DIR_KEY);
    if(h && h.queryPermission){
      _dirHandle = h;
      _autoStatus.pasta = (await h.queryPermission({mode:'readwrite'}))==='granted' ? 'ok' : 'permissao';
    }
  }catch(e){ console.error(e); }
  setInterval(()=>fazerBackupAutomatico(false), AUTO_INTERVALO_MS);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') fazerBackupAutomatico(false); });
  window.addEventListener('pagehide', ()=>{ fazerBackupAutomatico(false); });
  // 1ª cópia do dia logo após abrir (se ainda não houver)
  const hoje = todayISODate();
  if(temDadosNoDB() && !_autoMetaCache.some(e=>e.tipo==='dia' && e.dia===hoje)){
    setTimeout(()=>fazerBackupAutomatico(true), 8000);
  }
  atualizarUIAutoBackup();
  verificarPerdaNaAbertura();
  // Sistema abriu VAZIO mas existem cópias automáticas? Oferece recuperar.
  if(!temDadosNoDB() && _autoMetaCache.length){
    const candidatas = [..._autoMetaCache].filter(e=>e.tipo!=='seguranca' || true).sort((a,b)=>b.at-a.at);
    for(const c of candidatas){
      try{
        const info = await lerCopiaAutomatica(c.key);
        setTimeout(async ()=>{
          if(confirm('⚠️ O sistema abriu SEM DADOS, mas encontrei uma cópia automática de '+fmtDataHoraAuto(c.at)+' com: '+fmtResumoDados(info.resumo)+'.\n\nDeseja RECUPERAR essa cópia agora?')){
            await aplicarBackupNoSistema(info.data, false);
          }
        }, 600);
        break;
      }catch(e){ console.error('Cópia ignorada (danificada):', c.key, e); }
    }
  }
}

const APP_VERSAO = '2.6.0';
const URL_VERSAO = 'https://raw.githubusercontent.com/serfico21-arch/pdv/main/versao.json';
const URL_REPO_OK = 'https://github.com/serfico21-arch/pdv/';
let _upd = { checando:false, ultima:null, info:null, erro:null, avisou:false };
function cmpVersao(a,b){
  const pa=String(a).split('.').map(Number), pb=String(b).split('.').map(Number);
  for(let i=0;i<3;i++){ const d=(pa[i]||0)-(pb[i]||0); if(d) return d>0?1:-1; }
  return 0;
}
async function verificarAtualizacao(manual){
  if(_upd.checando) return;
  if(!navigator.onLine){ if(manual) showToast('Sem internet neste momento. Tente novamente quando estiver conectado.', 5000); return; }
  _upd.checando = true; _upd.erro = null; atualizarUIAtualizacao();
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 10000);
  try{
    const r = await fetch(URL_VERSAO, { cache:'no-store', signal:ctl.signal });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(!j || !/^\d+\.\d+\.\d+$/.test(String(j.versao||''))) throw new Error('Resposta inválida');
    if(j.instalador && String(j.instalador).indexOf(URL_REPO_OK)!==0) throw new Error('Endereço de download não confiável');
    if(j.html && String(j.html).indexOf(URL_REPO_OK)!==0) j.html = '';
    _upd.ultima = Date.now();
    _upd.info = cmpVersao(j.versao, APP_VERSAO) > 0 ? j : null;
    if(_upd.info && !_upd.avisou){ _upd.avisou = true; showToast('🔄 Nova versão '+j.versao+' disponível! Clique em "Atualização" no topo.', 8000); }
    if(manual && !_upd.info) showToast('✅ Você já está na versão mais recente ('+APP_VERSAO+').', 4000);
  }catch(e){
    _upd.erro = (e && e.name==='AbortError') ? 'Tempo esgotado' : String(e && e.message || e);
    if(manual) showToast('Não consegui verificar atualizações agora ('+_upd.erro+').', 6000);
  }finally{
    clearTimeout(t); _upd.checando = false; atualizarUIAtualizacao();
  }
}
function atualizarUIAtualizacao(){
  const b = document.getElementById('updBadge');
  if(b){
    if(_upd.info){ b.style.display='inline-flex'; b.textContent='🔄 Atualização '+_upd.info.versao; }
    else b.style.display='none';
  }
  const box = document.getElementById('updBox');
  if(box) box.innerHTML = renderUpdBox();
}

  let st;
  if(_upd.checando) st = 'Verificando…';
  else if(_upd.info) st = '<strong style="color:var(--vermelho)">Nova versão '+escapeHtml(_upd.info.versao)+' disponível.</strong> <button class="btn btn-primary btn-sm" onclick="abrirModalAtualizacao()">Ver e atualizar</button>';
  else if(_upd.ultima) st = '✅ Você está na versão mais recente. (verificado às '+new Date(_upd.ultima).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+')';
  else if(_upd.erro) st = 'Não foi possível verificar agora ('+escapeHtml(_upd.erro)+').';

  return `<div class="small-note">Versão instalada: <strong>${APP_VERSAO}</strong> — ${st}</div>
    <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="verificarAtualizacao(true)" ${_upd.checando?'disabled':''}>🔄 Verificar atualizações agora</button>`;

async function baixarArquivoJSON(obj, nomeArquivo){
  const conteudo = JSON.stringify(obj, null, 2);
  // Em navegadores compatíveis (Chrome/Edge no computador), abre o seletor nativo
  // para escolher/reaproveitar uma pasta (ex: uma pasta "JSON" de backups no PC).
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: nomeArquivo,
        types: [{ description:'Arquivo de Backup (JSON)', accept:{'application/json':['.json']} }]
      });
      const writable = await handle.createWritable();
      await writable.write(conteudo);
      await writable.close();
      // confere se o arquivo gravado realmente abre (evita arquivo corrompido/zerado sem ninguém perceber)
      try{
        const f = await handle.getFile();
        JSON.parse(await f.text());
      }catch(errVerif){
        alert('🚨 ATENÇÃO: o arquivo de backup foi salvo, mas NÃO consegui ler de volta — ele pode estar corrompido. Salve novamente (de preferência em outra pasta ou pen-drive) e não confie nesse arquivo.');
        return false;
      }
      return true;
    }catch(err){
      if(err && err.name==='AbortError') return false; // usuário cancelou de propósito
      // qualquer outro erro cai no método tradicional abaixo
    }
  }
  const blob = new Blob([conteudo], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return true;
}

function csvEscape(val){
  const s = String(val??'');
  if(/[",\n;]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function toCSV(rows, columns){
  const header = columns.map(c=>csvEscape(c.label)).join(';');
  const lines = rows.map(r=>columns.map(c=>csvEscape(typeof c.value==='function'?c.value(r):r[c.key])).join(';'));
  return [header, ...lines].join('\r\n');
}

function onBackupFileSelected(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    const texto = e.target.result || '';
    if(!texto.trim() || /^[\s\u0000]*$/.test(texto)){
      alert('🚨 Este arquivo está VAZIO/CORROMPIDO (só contém bytes zerados, tamanho '+Math.round(file.size/1024)+' KB). Isso costuma acontecer quando o computador desliga ou a cópia falha durante a gravação. Ele não tem dados para restaurar. Procure outro backup (outra data, pen-drive, nuvem, pasta de backup automático) ou use uma cópia automática abaixo.');
      input.value=''; return;
    }
    let data;
    try{
      data = JSON.parse(texto);
    }catch(err){
      showToast('Não foi possível ler o arquivo: ele está incompleto ou danificado (não é um JSON válido). Nada foi alterado.', 8000);
      input.value=''; return;
    }
    if(Array.isArray(data)){
      showToast('⚠️ Este arquivo é uma lista de PRODUTOS (não um backup completo). Para importar produtos, use o botão "⬆️ Importar Produtos (JSON)" na aba Cadastros → Produtos. Aqui em "Restaurar backup" use o arquivo baixado em "⬇️ Baixar backup completo (JSON)".', 9000);
      input.value=''; return;
    }
    const v = validarBackup(data);
    if(!v.ok){ alert(v.erro); input.value=''; return; }
    const atual = contarDados(DB);
    const msg = 'Isso vai SUBSTITUIR os dados atuais pelos dados deste backup.\n\n'
      + 'Dados ATUAIS: '+fmtResumoDados(atual)+'\n'
      + 'Dados do BACKUP: '+fmtResumoDados(v.resumo)+'\n'
      + (data.exportadoEm ? 'Backup gerado em: '+fmtDataHoraAuto(new Date(data.exportadoEm).getTime())+'\n' : '')
      + '\nAntes, o sistema guarda uma cópia dos dados atuais. Deseja continuar?';
    if(!confirm(msg)){ input.value=''; return; }
    // Rede de segurança: guarda cópia interna e (se houver dados) baixa um arquivo com os dados atuais ANTES de sobrescrever.
    if(temDadosNoDB()){
      await baixarArquivoJSON(montarBackupJSON(), 'seguranca-antes-de-restaurar-'+todayISODate()+'-'+Date.now()+'.json');
    }
    await aplicarBackupNoSistema(data, true);
    input.value='';
  };
  reader.readAsText(file);
}

  const resposta = document.getElementById('uResposta').value.trim();
  const dica = document.getElementById('uDica').value.trim();
  if(!nome || !usuario){ showToast('Preencha nome e usuário.'); return; }
  const dup = (DB.settings.usuarios||[]).find(u=>u.usuario===usuario && u.id!==id);
  if(dup){ showToast('Já existe um usuário com esse login.'); return; }
  if(id){
    const u = DB.settings.usuarios.find(x=>x.id===id);
    Object.assign(u, {nome, usuario, papel, pergunta, resposta, dica});
    if(senha) u.senha = senha;
  }else{
    if(!senha){ showToast('Defina uma senha para o novo usuário.'); return; }
    DB.settings.usuarios.push({id:uid(), nome, usuario, senha, papel, pergunta, resposta, dica});
  }
  await saveKey(KEYS.settings, DB.settings);
  closeModal(); showToast('Usuário salvo com sucesso.'); renderContent();
}
async function deleteUsuario(id){
  const usuarios = DB.settings.usuarios||[];
  const isUltimo = usuarios.length<=1;
  const msg = isUltimo
    ? 'Este é o ÚNICO usuário cadastrado. Se excluir, ninguém mais terá login para entrar em Cadastros e Relatórios (o sistema vai pedir para criar um usuário novo do zero, como no primeiro acesso). Deseja realmente excluir?'
    : 'Tem certeza que deseja excluir este usuário?';
  if(!confirm(msg)) return;
  DB.settings.usuarios = usuarios.filter(x=>x.id!==id);
  await saveKey(KEYS.settings, DB.settings);
  showToast('Usuário excluído.');
  renderContent();
}
function onLogoFileSelected(input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 2*1024*1024){ showToast('Imagem muito grande. Use um arquivo de até 2MB.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = async ()=>{
      // Converte para PNG num canvas: garante formato 100% compatível com a geração de PDF,
      // independente do formato original enviado (webp, heic, etc.).
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      DB.settings.logoBase64 = canvas.toDataURL('image/png');
      DB.settings.logoWidth = img.naturalWidth;
      DB.settings.logoHeight = img.naturalHeight;
      await saveKey(KEYS.settings, DB.settings);
      updateBrandMark();
      showToast('Logo atualizado com sucesso.');
      renderContent();
    };
    img.onerror = ()=>{ showToast('Não foi possível ler essa imagem. Tente outro arquivo (JPG ou PNG).'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value='';
}
async function removerLogo(){
  DB.settings.logoBase64 = null;
  await saveKey(KEYS.settings, DB.settings);
  updateBrandMark();
  showToast('Logo removido.');
  renderContent();
}
