.prod-thumb-empty{width:36px; height:36px; border-radius:8px; background:var(--creme-2); display:inline-flex; align-items:center; justify-content:center; margin-right:8px; vertical-align:middle; flex-shrink:0; font-size:14px;}
.empty-state{text-align:center; padding:40px 20px; color:#a39a86;}
.flexbet{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.nf-card h2{margin-bottom:6px;}
.nf-chave-ok{background:#e3efe1; border-radius:10px; padding:12px 14px; margin:6px 0 12px; line-height:1.6;}
.nf-alerta{background:#fbe6e1; color:var(--vermelho); border-radius:10px; padding:10px 12px; margin:8px 0; font-weight:600;}
.nf-celular{display:flex; gap:14px; flex-wrap:wrap; align-items:center; background:#eef0fb; border-radius:10px; padding:12px 14px; margin:8px 0 14px; font-size:14px; line-height:1.5;}
.nf-celular-on{background:#e3efe1;}
.nf-celular-qr{background:#fff; border-radius:8px; padding:4px; line-height:0;}
.nf-passos{background:#fff6e5; border-radius:10px; padding:10px 12px; margin-bottom:10px; font-size:14px; line-height:1.5;}
.nf-botoes{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;}
.nf-botoes .btn{cursor:pointer;}
.nf-soltar{border:2px dashed var(--linha); border-radius:10px; padding:14px; text-align:center; color:#8b8270; margin-top:12px; font-size:13px;}
.nf-soltar.on{border-color:var(--verde-900); background:#e3efe1;}
.nf-cab{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin:12px 0; line-height:1.5;}
.nf-tabela-wrap{overflow-x:auto;}
.nf-tabela td{vertical-align:top;}
.nf-tabela tr.nf-sem{background:#fff6e5;}
.nf-num{width:80px; text-align:right;}
.nf-prod-input{width:100%;}
.nf-check{display:flex; gap:8px; align-items:center; margin-top:14px; font-size:14px;}
.small-note{font-size:12px; color:#8b8270; margin-top:10px; line-height:1.5;}
.scan-feedback{margin-top:8px; padding:9px 13px; border-radius:9px; font-size:13.5px; display:none; align-items:center; gap:8px; flex-wrap:wrap;}
.scan-feedback.show{display:flex;}
.scan-feedback.found{background:rgba(31,152,102,0.12); border:1px solid rgba(31,152,102,0.35); color:var(--verde-800);}
.scan-feedback.notfound{background:rgba(178,64,47,0.10); border:1px solid rgba(178,64,47,0.35); color:var(--vermelho);}
.scan-feedback .sf-code{font-family:'JetBrains Mono',monospace; font-weight:700; background:rgba(0,0,0,0.06); padding:2px 7px; border-radius:5px;}
.scan-feedback .sf-meta{flex-basis:100%; font-size:12px; opacity:0.85; display:flex; gap:12px; flex-wrap:wrap;}
.scan-feedback .sf-meta b{font-weight:700;}
.scan-feedback .sf-meta .sf-baixo{color:var(--vermelho); font-weight:700;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--linha); border-radius:10px;}

.lock-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(245,219,61,0.18);color:var(--ouro);padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.bar-row .bar-lbl{width:90px; font-size:12px; color:var(--verde-800); font-weight:700; flex-shrink:0;}
.bar-track{flex:1; background:var(--creme-2); border-radius:6px; height:20px; overflow:hidden;}
.bar-fill{background:linear-gradient(90deg, var(--terracota), var(--ouro)); height:100%; border-radius:6px;}
.bar-val{width:100px; text-align:right; font-size:12.5px; font-weight:700; color:var(--verde-900); flex-shrink:0;}

/* camera scan modal */
#camWrap{position:relative; width:100%; border-radius:12px; overflow:hidden; background:#000;}
#camVideo{width:100%; display:block;}
.cam-frame{position:absolute; inset:15% 10%; border:3px solid var(--terracota); border-radius:10px; box-shadow:0 0 0 2000px rgba(0,0,0,0.35);}

/* prévia do cupom (tela, antes de imprimir) */
.cupom-preview{background:#fff; color:#000; font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.5; padding:14px; border:1px solid var(--linha); border-radius:8px; max-width:320px; margin:0 auto; max-height:60vh; overflow-y:auto;}
.cupom-preview .center{text-align:center;}
.cupom-preview .rstore-name{font-size:15px; font-weight:800; letter-spacing:0.03em;}
.cupom-preview .rfiscal-label{font-weight:700;}
.cupom-preview .rline{display:flex; justify-content:space-between; gap:6px;}
.cupom-preview .ritem-header{font-weight:700; text-transform:uppercase; font-size:11px;}
.cupom-preview .ritem{margin-bottom:4px;}
.cupom-preview .ritem-desc{font-weight:700;}
.cupom-preview .ritem-calc{font-size:11px; color:#333;}
.cupom-preview .rtotal-line{font-size:14px; margin:4px 0;}
.cupom-preview .rdash{border-top:1px dashed #999; margin:6px 0;}
.cupom-preview .rbarcode{height:34px; margin-top:8px; background:repeating-linear-gradient(90deg, #000 0px, #000 2px, transparent 2px, transparent 4px, #000 4px, #000 5px, transparent 5px, transparent 8px);}
.cupom-preview .rbarcode-num{font-size:10px; letter-spacing:0.2em; margin-top:2px; text-align:center;}

/* receipt (impressão) */
#receiptArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #receiptArea, #receiptArea *{visibility:visible;}
  #receiptArea{display:block !important; position:absolute; top:0; left:0; padding:2mm 1mm; font-family:'JetBrains Mono',monospace; color:#000; line-height:1.4; word-wrap:break-word;}
  #receiptArea .rstore-name{font-size:1.25em; font-weight:800; letter-spacing:0.03em;}
  #receiptArea .rfiscal-label{font-weight:700;}
  #receiptArea .rline{display:flex; justify-content:space-between; gap:6px;}
  #receiptArea .ritem-header{font-weight:700; text-transform:uppercase; font-size:0.9em;}
  #receiptArea .ritem{margin-bottom:3px;}
  #receiptArea .ritem-desc{font-weight:700;}
  #receiptArea .ritem-calc{font-size:0.95em; color:#333;}
  #receiptArea .rtotal-line{font-size:1.15em; margin:2px 0;}
  #receiptArea .rdash{border-top:1px dashed #000; margin:5px 0;}
  #receiptArea .rbarcode{
    height:34px; margin-top:8px;
    background:repeating-linear-gradient(90deg, #000 0px, #000 2px, transparent 2px, transparent 4px, #000 4px, #000 5px, transparent 5px, transparent 8px);
  }
  #receiptArea .rbarcode-num{font-size:0.9em; letter-spacing:0.2em; margin-top:2px;}
}
</style>
</head>

<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="mark" id="brandMark" onclick="onLogoTap()" style="cursor:pointer;" title="">PC</div>
        <div>
          <h1 id="brandNome">FCosta</h1>
          <span id="brandSlogan">Frente de Caixa</span>
        </div>
      </div>
      <div class="right-tools">
        <span id="versaoBadge" onclick="mostrarVersaoAtualizada(true)" title="Versão do gestor instalada neste computador" style="cursor:pointer; background:#eed600; color:#14206b; font-size:18px; font-weight:800; padding:6px 14px; border-radius:12px; letter-spacing:0.02em; box-shadow:0 0 0 3px rgba(255,255,255,0.35); white-space:nowrap;"></span>
        <select class="op-select" id="opSelect" onchange="setOperator(this.value)"></select>
        <span class="lock-badge" id="saveWarnBadge" style="display:none; background:rgba(178,64,47,0.3); color:#ffb3a3;">🚨 Falha ao salvar — não feche o sistema</span>
        <span class="lock-badge" id="updBadge" style="display:none; cursor:pointer; background:rgba(217,164,65,0.35); color:#fff3d1;" onclick="abrirModalAtualizacao()" title="Clique para ver a atualização"></span>
        <span class="lock-badge" id="licBadge" style="display:none; cursor:pointer; background:rgba(217,164,65,0.35); color:#fff3d1;" onclick="abrirModalLicenca()" title="Clique para ver a licença"></span>
        <span class="lock-badge" id="autoBackupBadge" style="display:none;" title="Cópia automática de segurança dos dados"></span>
        <span class="lock-badge" id="lockIndicator">🔒 Área protegida bloqueada</span>
        <button class="btn btn-ghost btn-sm" id="btnFullscreen" style="color:#fff;border-color:rgba(255,255,255,0.3);" onclick="toggleFullscreen()" title="Tela cheia (F2)">⛶ Tela Cheia</button>
        <button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,0.3);" onclick="abrirManualAjuda()">❓ Ajuda</button>
      </div>
    </div>
    <div class="nav" id="mainNav"></div>
  </div>
  <div class="content" id="content"></div>
</div>
<span class="gestor-tag-fixed">GESTOR FCOSTA</span>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="receiptArea"></div>

/* ---------------- Armazenamento (local, no próprio computador) ----------------
   Usa IndexedDB do navegador — funciona 100% offline, sem servidor e sem
   depender de nada externo. Se por algum motivo o IndexedDB não estiver
   disponível, cai automaticamente para localStorage como reserva. */
const DB_NOME = 'pinheiro_costa_pdv';
const DB_STORE = 'kv';
let _idbPromise = null;
function abrirIDB(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB indisponível')); return; }
    const req = indexedDB.open(DB_NOME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(DB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _idbPromise;
}
async function idbGet(key){
  const db = await abrirIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await abrirIDB();
  return new Promise((resolve, reject)=>{
    // durability 'strict': o navegador só confirma depois de gravar de verdade no disco.
    // Protege contra queda de energia (o padrão "relaxed" pode perder as últimas gravações).
    let tx;
    try{ tx = db.transaction(DB_STORE, 'readwrite', {durability:'strict'}); }
    catch(e){ tx = db.transaction(DB_STORE, 'readwrite'); }
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
    tx.onabort = ()=> reject(tx.error || new Error('Transação cancelada'));
  });
}
async function idbDelete(key){
  const db = await abrirIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function loadKey(key, fallback){
  try{
    const val = await idbGet(key);
    if(val !== undefined && val !== null) return JSON.parse(val);
  }catch(e){ console.error('IndexedDB falhou ao ler, tentando localStorage', key, e); }
  try{
    const raw = localStorage.getItem(key);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* ignora */ }
  return fallback;
}
async function saveKey(key, value, tentativa){
  tentativa = tentativa || 1;
  try{
    await idbSet(key, JSON.stringify(value));
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* apenas reserva extra, ignora erro de espaço */ }
    limparAvisoSalvamento();
    if(typeof marcarAlterado==='function') marcarAlterado();
  }catch(e){
    console.error('Falha ao salvar', key, e, '— tentativa', tentativa);
    if(tentativa < 3){
      await new Promise(r=>setTimeout(r, 600*tentativa));
      return saveKey(key, value, tentativa+1);
    }
    // Reserva final: tenta gravar direto no localStorage antes de avisar o usuário
    try{
      localStorage.setItem(key, JSON.stringify(value));
      limparAvisoSalvamento();
      return;
    }catch(e2){ /* segue para o aviso abaixo */ }
    // Depois de 3 tentativas (e da reserva), avisa de forma persistente — isso não pode passar despercebido
    mostrarAvisoSalvamentoFalhou(key);
  }
}
let avisoSalvamentoAtivo = false;
function mostrarAvisoSalvamentoFalhou(key){
  avisoSalvamentoAtivo = true;
  showToast('🚨 Não consegui salvar os dados ("'+key+'"). Verifique se o navegador não está em modo anônimo/privado e se há espaço em disco. NÃO feche o sistema — tente de novo ou baixe um backup imediatamente.', 8000);
  renderNav();
}
function limparAvisoSalvamento(){
  if(avisoSalvamentoAtivo){ avisoSalvamentoAtivo = false; renderNav(); }
}
async function loadAll(){
  DB.products = await loadKey(KEYS.products, []);
  DB.movements = await loadKey(KEYS.movements, []);
  DB.sales = await loadKey(KEYS.sales, []);
  DB.caixaSessions = await loadKey(KEYS.caixaSessions, []);
  DB.lancamentos = await loadKey(KEYS.lancamentos, []);
  DB.contas = await loadKey(KEYS.contas, []);
  DB.suppliers = await loadKey(KEYS.suppliers, []);
  DB.clients = await loadKey(KEYS.clients, []);
  DB.employees = await loadKey(KEYS.employees, []);
  DB.settings = await loadKey(KEYS.settings, { password:null, operadores:['Caixa 1'], printer:{connected:false, name:null} });
  if(DB.settings.logoBase64===undefined) DB.settings.logoBase64 = DEFAULT_LOGO_B64;
  if(DB.settings.storeName===undefined) DB.settings.storeName = '';
  if(DB.settings.pixKey===undefined) DB.settings.pixKey = '';
  if(DB.settings.pixCidade===undefined) DB.settings.pixCidade = '';
  if(DB.settings.saldoInicialCaixa===undefined) DB.settings.saldoInicialCaixa = 0;
  if(!DB.settings.saldoInicialData) DB.settings.saldoInicialData = todayISODate();
  if(!DB.settings.operadores || !DB.settings.operadores.length) DB.settings.operadores=['Caixa 1'];
  // Migração: se existia a senha única antiga dos Cadastros e ainda não há usuários com login,
  // cria automaticamente um administrador para não travar o acesso de quem já usava o sistema.
  if(!DB.settings.usuarios){
    DB.settings.usuarios = DB.settings.password
      ? [{id:uid(), nome:'Administrador', usuario:'admin', senha:DB.settings.password, papel:'admin', pergunta:'', resposta:'', dica:''}]
      : [];
    await saveKey(KEYS.settings, DB.settings);
  }
  operatorName = DB.settings.operadores[0];
}

/* ---------------- Utilidades ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function brl(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function todayISODate(){ return toLocalDateStr(new Date()); }
function toLocalDateStr(d){
  d = (d instanceof Date) ? d : new Date(d);
  const off = d.getTimezoneOffset()*60000;
  return new Date(d.getTime() - off).toISOString().slice(0,10);
}
function showToast(msg, ms=3000){
  const root=document.getElementById('toastRoot');
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  root.appendChild(el); setTimeout(()=>el.remove(), ms);
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normalizarBusca(s){ return String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
// Chaves para achar cadastro repetido: código só com números e sem zeros na frente; nome sem acento, pontuação e espaço extra ("5 kg" = "5kg").
function chaveCodigo(b){ return String(b??'').replace(/\D/g,'').replace(/^0+/,''); }
function chaveNome(n){ return normalizarBusca(n).replace(/(\d)\s*[,.]\s*(\d)/g,'$1_$2').replace(/(\d)\s+(kg|g|gr|grs|ml|l|lt|lts|un|und|unid|cx|pct)\b/g,'$1$2').replace(/[^a-z0-9_]+/g,' ').trim(); }

/* ================================================================
   PIX — geração do código "Copia e Cola" (BR Code / EMV) e do QR Code
   100% local (sem servidor, sem internet) a partir da Chave Pix
   cadastrada em Cadastros → Dados da Loja.
   ================================================================ */
function pixTextoPadrao(s){ return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase(); }
function pixCampo(id, valor){
  const v = String(valor);
  return id + String(v.length).padStart(2,'0') + v;
}
function pixCRC16(payload){
  let crc = 0xFFFF;
  for(let i=0;i<payload.length;i++){
    crc ^= (payload.charCodeAt(i) << 8);
    for(let j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
// Retorna null se não houver chave Pix cadastrada nas configurações da loja.
function montarPayloadPix(valor, txid){
  const chave = (DB.settings.pixKey||'').trim();
  if(!chave) return null;
  const nome = (pixTextoPadrao(DB.settings.storeName||'').slice(0,25)) || 'RECEBEDOR';
  const cidade = (pixTextoPadrao(DB.settings.pixCidade||'').slice(0,15)) || 'BRASIL';
  const valorStr = Number(valor||0).toFixed(2);
  const txidFinal = String(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25) || '***';
  const merchantAccountInfo = pixCampo('00','br.gov.bcb.pix') + pixCampo('01', chave);
  let payload =
    pixCampo('00','01') +
    pixCampo('26', merchantAccountInfo) +
    pixCampo('52','0000') +
    pixCampo('53','986') +
    pixCampo('54', valorStr) +
    pixCampo('58','BR') +
    pixCampo('59', nome) +
    pixCampo('60', cidade) +
    pixCampo('62', pixCampo('05', txidFinal));
  payload += '6304';
  return payload + pixCRC16(payload);
}
// Gera o QR Code em SVG puro (biblioteca local, sem internet), tamanho fixo e com margem — nunca corta.
function gerarQRCodeSVG(texto, tamanhoPx){
  tamanhoPx = tamanhoPx || 200;
  try{
    const qr = qrcode(0, 'M');
    qr.addData(texto);
    qr.make();
    const n = qr.getModuleCount();
    const cell = tamanhoPx / (n + 8); // margem de 4 módulos (quiet zone) de cada lado
    const size = cell * (n + 8);
    let path = '';
    for(let r=0;r<n;r++){
      for(let c=0;c<n;c++){
        if(qr.isDark(r,c)){
          const x = (c+4)*cell, y = (r+4)*cell;
          path += `M${x.toFixed(2)},${y.toFixed(2)}h${cell.toFixed(2)}v${cell.toFixed(2)}h-${cell.toFixed(2)}z`;
        }
      }
    }
    return `<svg viewBox="0 0 ${size.toFixed(2)} ${size.toFixed(2)}" width="${tamanhoPx}" height="${tamanhoPx}" xmlns="http://www.w3.org/2000/svg" style="background:#fff; display:block;"><rect width="${size.toFixed(2)}" height="${size.toFixed(2)}" fill="#fff"/><path d="${path}" fill="#000"/></svg>`;
  }catch(err){
    return `<div class="small-note" style="color:var(--vermelho, #b91c1c);">Não foi possível gerar o QR Code (${escapeHtml(err.message||'erro')}).</div>`;
  }
}
// Baixa o QR Code exibido na Frente de Caixa como imagem PNG, pronta para enviar pelo WhatsApp.
function baixarQRCodePixVenda(){
  const wrapper = document.getElementById('pixQrVenda');
  const svgEl = wrapper ? wrapper.querySelector('svg') : null;
  if(!svgEl) return;
  baixarQRCodeSVGElement(svgEl, 'qrcode-pix.png');
}
// Baixa o QR Code exibido como imagem PNG, pronta para enviar pelo WhatsApp.
function baixarQRCodePix(svgElId, nomeArquivo){
  const svgEl = document.getElementById(svgElId);
  if(!svgEl) return;
  baixarQRCodeSVGElement(svgEl, nomeArquivo);
}
function baixarQRCodeSVGElement(svgEl, nomeArquivo){
  const svgData = new XMLSerializer().serializeToString(svgEl);
  const img = new Image();
  const svgBlob = new Blob([svgData], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  img.onload = function(){
    const escala = 4; // resolução maior para ficar nítido no celular
    const canvas = document.createElement('canvas');
    canvas.width = img.width*escala; canvas.height = img.height*escala;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = nomeArquivo || 'qrcode-pix.png';
    document.body.appendChild(a); a.click(); a.remove();
  };
  img.src = url;
}

function diasDesdeUltimoBackup(){
  const last = DB.settings.lastBackupAt;
  if(!last) return null;
  return Math.floor((Date.now() - new Date(last).getTime()) / (1000*60*60*24));
}

  const temDados = DB.products.length>0 || DB.sales.length>0;
  if(!temDados) return '';
  const dias = diasDesdeUltimoBackup();
  const nuncaFezBackup = dias===null;
  if(!nuncaFezBackup && dias<7) return '';
  return `<div class="alert-banner" style="background:#fff6df; border-color:var(--terracota-esc);">
    <div class="txt" style="color:var(--terracota-esc);">

function toggleOutraPergunta(idPrefix){

async function setupCadastroPassword(){
  const nome=document.getElementById('setupNome').value.trim();
  const usuario=document.getElementById('setupUsuario').value.trim().toLowerCase();
  const p1=document.getElementById('newPw1').value, p2=document.getElementById('newPw2').value;
  const pergunta=getPerguntaSegurancaValor('setupPergunta');
  const resposta=document.getElementById('setupResposta').value.trim();
  const dica=document.getElementById('setupDica').value.trim();
  if(!nome || !usuario){ document.getElementById('pwErr').innerHTML='<div class="errmsg">Preencha nome e usuário.</div>'; return; }
  if(!p1 || p1.length<4){ document.getElementById('pwErr').innerHTML='<div class="errmsg">A senha deve ter ao menos 4 caracteres.</div>'; return; }
  if(p1!==p2){ document.getElementById('pwErr').innerHTML='<div class="errmsg">As senhas não coincidem.</div>'; return; }
  DB.settings.usuarios = [{id:uid(), nome, usuario, senha:p1, papel:'admin', pergunta, resposta, dica}];
  await saveKey(KEYS.settings, DB.settings);
  cadastrosUnlocked = true;
  closeModal();
  currentTab = tabAposLogin || 'cadastros'; tabAposLogin=null;
  renderNav(); renderContent();
}
function tryCadastroPassword(){
  const usuario = document.getElementById('loginUsuario').value.trim().toLowerCase();
  const p = document.getElementById('cadPw').value;
  const found = (DB.settings.usuarios||[]).find(u=>u.usuario===usuario && u.senha===p);
  if(!found){ document.getElementById('pwErr').innerHTML='<div class="errmsg">Usuário ou senha incorretos.</div>'; return; }
  cadastrosUnlocked = true;
  closeModal();
  currentTab = tabAposLogin || 'cadastros'; tabAposLogin=null;
  renderNav(); renderContent();
  if(found.papel==='admin') setTimeout(mostrarNovidadesAdm, 400);
}

function abrirEsqueciSenha(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg"><div class="modal">
      <h3>Esqueci minha senha</h3>
      <p class="muted">Informe seu usuário para recuperar o acesso pela pergunta de segurança.</p>

      <div class="field"><label>Usuário</label><input id="fsUsuario" placeholder="Seu usuário"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="askCadastroPassword()">Voltar</button>
        <button class="btn btn-primary" onclick="continuarEsqueciSenha()">Continuar</button>
      </div>
    </div></div>`;
}
function continuarEsqueciSenha(){
  const usuario = document.getElementById('fsUsuario').value.trim().toLowerCase();
  const found = (DB.settings.usuarios||[]).find(u=>u.usuario===usuario);
  if(!found){ document.getElementById('fsErr').innerHTML='<div class="errmsg">Usuário não encontrado.</div>'; return; }
  if(!found.pergunta || !found.resposta){
    document.getElementById('fsErr').innerHTML='<div class="errmsg">Este usuário não tem uma pergunta de segurança cadastrada. Peça para outro administrador redefinir sua senha em Cadastros → Usuários.</div>';
    return;
  }
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg"><div class="modal">
      <h3>Pergunta de segurança</h3>
      <p class="muted"><strong>${escapeHtml(found.pergunta)}</strong></p>
      <div id="fsErr2"></div>
      <div class="field"><label>Sua resposta</label><input id="fsResposta" placeholder="Digite a resposta"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="abrirEsqueciSenha()">Voltar</button>
        <button class="btn btn-primary" onclick="verificarRespostaSeguranca('${found.id}')">Verificar</button>
      </div>
    </div></div>`;
}
function verificarRespostaSeguranca(userId){
  const found = (DB.settings.usuarios||[]).find(u=>u.id===userId);
  const resposta = document.getElementById('fsResposta').value.trim().toLowerCase();
  if(!found || resposta!==(found.resposta||'').trim().toLowerCase()){
    document.getElementById('fsErr2').innerHTML='<div class="errmsg">Resposta incorreta.</div>';
    return;
  }
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg"><div class="modal">
      <h3>Criar nova senha</h3>
      <div id="fsErr3"></div>
      <div class="field"><label>Nova senha</label><input type="password" id="fsNovaSenha1" placeholder="Nova senha"></div>
      <div class="field"><label>Confirme a nova senha</label><input type="password" id="fsNovaSenha2" placeholder="Repita a nova senha"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarNovaSenhaRecuperada('${userId}')">Salvar nova senha</button>
      </div>
    </div></div>`;
}
async function salvarNovaSenhaRecuperada(userId){
  const found = (DB.settings.usuarios||[]).find(u=>u.id===userId);
  const p1 = document.getElementById('fsNovaSenha1').value;
  const p2 = document.getElementById('fsNovaSenha2').value;
  if(!p1 || p1.length<4){ document.getElementById('fsErr3').innerHTML='<div class="errmsg">A senha deve ter ao menos 4 caracteres.</div>'; return; }
  if(p1!==p2){ document.getElementById('fsErr3').innerHTML='<div class="errmsg">As senhas não coincidem.</div>'; return; }
  found.senha = p1;
  await saveKey(KEYS.settings, DB.settings);
  showToast('Senha redefinida com sucesso! Faça login novamente.');
  askCadastroPassword();
}

let selectedProductId = null;
function buscarProdutoPorTexto(val){
  if(!val) return null;
  return DB.products.find(p=>p.barcode && p.barcode===val) || DB.products.find(p=>p.name===val);
}
function onProdutoDigitado(){
  const val = document.getElementById('inputProduto').value.trim();
  const p = buscarProdutoPorTexto(val);
  const qtdInput = document.getElementById('inputQtd');
  const fotoBox = document.getElementById('vendaFotoPreview');
  const fb = document.getElementById('scanFeedback');
  if(p){
    selectedProductId = p.id;
    document.getElementById('inputPrecoUnit').value = p.price;
    if(p.saleType==='peso'){ qtdInput.step='0.001'; qtdInput.min='0.001'; }
    else{ qtdInput.step='1'; qtdInput.min='1'; }
    if(fotoBox) fotoBox.innerHTML = p.photoBase64 ? `<img src="${p.photoBase64}">` : '<span style="font-size:20px;">📦</span>';
    if(fb){
      fb.className = 'scan-feedback show found';
      const estoqueTxt = p.stock + (p.saleType==='peso' ? ' kg' : ' un.');
      const estoqueBaixo = p.stock<=(p.minStock||0);
      fb.innerHTML = `<span class="sf-code">${escapeHtml(p.barcode||'sem código')}</span> <span>${escapeHtml(p.name)}</span>
        <div class="sf-meta">
          <span><b>Marca:</b> ${escapeHtml(p.brand||'—')}</span>
          <span><b>Fornecedor:</b> ${escapeHtml(fornecedorNome(p.supplierId))}</span>
          <span><b>Estoque:</b> <span class="${estoqueBaixo?'sf-baixo':''}">${estoqueTxt}${estoqueBaixo?' ⚠️':''}</span></span>
        </div>`;
    }
  }else{
    selectedProductId = null;
    if(fotoBox) fotoBox.innerHTML = '<span style="font-size:20px;">📦</span>';
    if(fb){
      if(val){
        fb.className = 'scan-feedback show notfound';
        fb.innerHTML = `<span class="sf-code">${escapeHtml(val)}</span> <span>produto não encontrado</span>`;
      }else{
        fb.className = 'scan-feedback';
        fb.innerHTML = '';
      }
    }
  }
  atualizarSubtotalForm();
}
function atualizarSubtotalForm(){
  const qtd = parseFloat(document.getElementById('inputQtd').value)||0;
  const preco = parseFloat(document.getElementById('inputPrecoUnit').value)||0;
  document.getElementById('subtotalFormVal').textContent = brl(qtd*preco);
}
function adicionarItemVenda(){
  const nomeDigitado = document.getElementById('inputProduto').value.trim();
  let p = selectedProductId ? DB.products.find(x=>x.id===selectedProductId) : null;
  if(!p) p = buscarProdutoPorTexto(nomeDigitado);
  if(!p){ showToast('Produto não encontrado. Confira o nome ou o código de barras.'); return; }
  const qty = parseFloat(document.getElementById('inputQtd').value);
  const price = parseFloat(document.getElementById('inputPrecoUnit').value) || p.price;
  if(!qty || qty<=0){ showToast('Informe uma quantidade válida.'); return; }
  if(!price || price<=0){ showToast('Informe um preço válido.'); return; }
  const outrasQtd = cart.filter(l=>l.productId===p.id).reduce((s,l)=>s+l.qty,0);
  if(outrasQtd+qty > p.stock){ showToast('Estoque insuficiente para '+p.name+' (disponível: '+p.stock+')'); return; }
  const existing = cart.find(l=>l.productId===p.id && l.price===price);
  if(existing) existing.qty += qty;
  else cart.push({lineId:uid(), productId:p.id, name:p.name, price, cost:p.cost||0, qty, saleType:p.saleType||'unidade'});
  limparFormularioVenda();
  refreshCartUI();
}
function limparFormularioVenda(){
  selectedProductId = null;
  const prodEl = document.getElementById('inputProduto');
  const qtdEl = document.getElementById('inputQtd');
  const precoEl = document.getElementById('inputPrecoUnit');
  const subEl = document.getElementById('subtotalFormVal');
  const fotoBox = document.getElementById('vendaFotoPreview');
  const fb = document.getElementById('scanFeedback');
  if(prodEl) prodEl.value='';
  if(qtdEl){ qtdEl.value=1; qtdEl.step='1'; qtdEl.min='1'; }
  if(precoEl) precoEl.value='';
  if(subEl) subEl.textContent = brl(0);
  if(fotoBox) fotoBox.innerHTML = '<span style="font-size:20px;">📦</span>';
  if(fb){ fb.className = 'scan-feedback'; fb.innerHTML = ''; }
  if(prodEl) prodEl.focus();
}
function editarItemCarrinho(lineId){
  const item = cart.find(l=>l.lineId===lineId);
  if(!item) return;
  cart = cart.filter(l=>l.lineId!==lineId);
  selectedProductId = item.productId;
  refreshCartUI();
  const prodEl = document.getElementById('inputProduto');
  const qtdEl = document.getElementById('inputQtd');
  const precoEl = document.getElementById('inputPrecoUnit');
  if(prodEl) prodEl.value = item.name;
  if(qtdEl) qtdEl.value = item.qty;
  if(precoEl) precoEl.value = item.price;
  atualizarSubtotalForm();
  if(prodEl) prodEl.focus();
}

  }
  if(payMethod==='misto'){
    const total = cart.reduce((s,i)=>s+i.price*i.qty,0);

      <div class="field"><label>💳 Cartão Crédito</label><input type="number" step="0.01" id="mistoCartaoCredito" oninput="calcMisto()" placeholder="0,00"></div>

      <div class="troco-box">
        <span>TOTAL DA VENDA</span>
        <strong>${brl(total)}</strong>
      </div>
      <div class="troco-box">
        <span>CONFERÊNCIA</span>
        <strong id="mistoDiffVal">Falta ${brl(total)}</strong>
      </div>`;
  }
  if(payMethod!=='dinheiro') return '';
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  return `
    <div class="field"><label>Valor recebido do cliente</label><input type="number" step="0.01" id="valorRecebido" oninput="calcTroco()" placeholder="0,00"></div>
    <div class="troco-box">
      <span>TROCO</span>
      <strong id="trocoVal">${brl(0)}</strong>

    <div class="bar-row"><div class="bar-lbl">Cartão Débito</div><div class="bar-track"><div class="bar-fill" style="width:${totalHoje?cartaoDebito/totalHoje*100:0}%"></div></div><div class="bar-val">${brl(cartaoDebito)}</div></div>

function renderCartItems(){
  if(cart.length===0) return '<div class="empty-state" style="padding:24px 10px;">🛒 Nenhum item adicionado ainda</div>';
  return cart.map(i=>{
    const isPeso = i.saleType==='peso';

    const thumb = prod && prod.photoBase64 ? `<img class="ci-thumb" src="${prod.photoBase64}">` : '<span class="ci-thumb-empty">📦</span>';
    const qtyCell = isPeso
      ? `<div class="mono" style="text-align:center;">${Number(i.qty).toFixed(3)}</div>`
      : `<div class="qty-stepper">
          <button class="qbtn" onclick="ajustarQtdItem('${i.lineId}',-1)" title="Diminuir">−</button>
          <span class="qval">${i.qty}</span>
          <button class="qbtn" onclick="ajustarQtdItem('${i.lineId}',1)" title="Aumentar">+</button>
        </div>`;
    return `
    <div class="cart-item">
      <div>${thumb}</div>
      <div class="ci-nm">${escapeHtml(i.name)}${isPeso?' <span class="muted">(Kg)</span>':''}</div>
      ${qtyCell}
      <div class="mono" style="text-align:center;">${brl(i.price)}</div>
      <div class="ci-tot">${brl(i.price*i.qty)}</div>
      <div class="ci-actions">
        <button class="ci-rm" title="Editar" onclick="editarItemCarrinho('${i.lineId}')">✎</button>
        <button class="ci-rm" title="Remover" onclick="removeLine('${i.lineId}')">✕</button>
      </div>
    </div>`;
  }).join('');
}
function ajustarQtdItem(lineId, delta){
  const item = cart.find(l=>l.lineId===lineId);
  if(!item || item.saleType==='peso') return;
  const novaQtd = item.qty + delta;
  if(novaQtd<=0){ cart = cart.filter(l=>l.lineId!==lineId); refreshCartUI(); return; }
  const produto = DB.products.find(p=>p.id===item.productId);
  const outrasQtd = cart.filter(l=>l.productId===item.productId && l.lineId!==lineId).reduce((s,l)=>s+l.qty,0);
  if(produto && (outrasQtd+novaQtd) > produto.stock){ showToast('Estoque insuficiente para '+item.name+' (disponível: '+produto.stock+')'); return; }
  item.qty = novaQtd;
  refreshCartUI();
}
function refreshCartUI(){
  const cartEl = document.getElementById('cartItems');
  if(cartEl) cartEl.innerHTML = renderCartItems();
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const totEl = document.getElementById('cartTotalVal');
  if(totEl) totEl.textContent = brl(total);
  const dinheiroEl = document.getElementById('dinheiroBox');
  if(dinheiroEl) dinheiroEl.innerHTML = renderDinheiroBox();
  const finishBtn = document.querySelector('.btn-primary[onclick="finalizarVenda()"]');
  if(finishBtn) finishBtn.disabled = cart.length===0;
}
function removeLine(lineId){ cart = cart.filter(l=>l.lineId!==lineId); refreshCartUI(); }
function limparCarrinho(){ cart=[]; limparFormularioVenda(); refreshCartUI(); }
function setPay(m){ payMethod=m; renderContent(); }
function labelFormaPagamento(pm){
  return {dinheiro:'Dinheiro', cartao:'Cartão', cartaoCredito:'Cartão Crédito', cartaoDebito:'Cartão Débito', pix:'Pix', misto:'Misto', fiado:'Fiado'}[pm] || pm;
}
function somarPorFormaPagamento(vendas){
  const out = {dinheiro:0, cartao:0, cartaoCredito:0, cartaoDebito:0, pix:0, fiado:0, mistoCount:0};
  vendas.forEach(s=>{
    if(s.payMethod==='misto' && s.mistoBreakdown){
      out.dinheiro += s.mistoBreakdown.dinheiro||0;
      const cred = s.mistoBreakdown.cartaoCredito||0;
      const deb = s.mistoBreakdown.cartaoDebito||0;
      // compatibilidade com vendas antigas que só tinham "cartao" (sem separar crédito/débito)
      const cartaoAntigo = (cred===0 && deb===0) ? (s.mistoBreakdown.cartao||0) : 0;
      out.cartaoCredito += cred;
      out.cartaoDebito += deb;
      out.cartao += cred + deb + cartaoAntigo;
      out.pix += s.mistoBreakdown.pix||0;
      out.mistoCount++;
    } else if(s.payMethod==='cartaoCredito'){
      out.cartaoCredito += s.total; out.cartao += s.total;
    } else if(s.payMethod==='cartaoDebito'){
      out.cartaoDebito += s.total; out.cartao += s.total;
    } else if(s.payMethod==='cartao'){
      // compatibilidade com vendas antigas (antes da separação crédito/débito na venda direta)
      out.cartao += s.total;
    } else if(Object.prototype.hasOwnProperty.call(out, s.payMethod)){
      out[s.payMethod] += s.total;
    }
  });
  return out;
}
function calcTroco(){
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const inp = document.getElementById('valorRecebido');
  const trocoEl = document.getElementById('trocoVal');
  if(!inp||!trocoEl) return;
  const recebido = parseFloat(inp.value)||0;
  const troco = recebido-total;
  trocoEl.textContent = brl(troco>0?troco:0);
  trocoEl.style.color = troco<0 ? '#ff8a75' : '#fff';
}
function calcMisto(){
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const d = parseFloat(document.getElementById('mistoDinheiro')?.value)||0;
  const cCred = parseFloat(document.getElementById('mistoCartaoCredito')?.value)||0;
  const cDeb = parseFloat(document.getElementById('mistoCartaoDebito')?.value)||0;
  const p = parseFloat(document.getElementById('mistoPix')?.value)||0;
  const soma = d+cCred+cDeb+p;
  const diff = soma-total;
  const diffEl = document.getElementById('mistoDiffVal');
  if(!diffEl) return;
  if(Math.abs(diff)<0.005){ diffEl.textContent='Confere ✓'; diffEl.style.color='#8fe3a0'; }
  else if(diff>0){ diffEl.textContent='Sobrando '+brl(diff); diffEl.style.color='#ff8a75'; }
  else{ diffEl.textContent='Falta '+brl(-diff); diffEl.style.color='#ff8a75'; }
}
function focusScanInput(){
  const el = document.getElementById('inputProduto');
  if(el) setTimeout(()=>el.focus(), 50);
}
async function finalizarVenda(){
  const session = getOpenSession();
  if(!session){ showToast('Abra o caixa antes de vender.'); return; }
  if(cart.length===0) return;
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  let cliente = null;
  let valorRecebido = null, troco = null;
  let mistoBreakdown = null;
  if(payMethod==='dinheiro'){
    valorRecebido = parseFloat(document.getElementById('valorRecebido')?.value)||0;
    if(valorRecebido < total){ showToast('Valor recebido é menor que o total.'); return; }
    troco = valorRecebido - total;
  }
  if(payMethod==='misto'){
    const d = parseFloat(document.getElementById('mistoDinheiro')?.value)||0;
    const cCred = parseFloat(document.getElementById('mistoCartaoCredito')?.value)||0;
    const cDeb = parseFloat(document.getElementById('mistoCartaoDebito')?.value)||0;
    const p = parseFloat(document.getElementById('mistoPix')?.value)||0;
    const soma = d+cCred+cDeb+p;
    if(Math.abs(soma-total) > 0.01){
      showToast('A soma dos valores ('+brl(soma)+') não bate com o total da venda ('+brl(total)+').');
      return;
    }
    mistoBreakdown = {dinheiro:d, cartaoCredito:cCred, cartaoDebito:cDeb, cartao:cCred+cDeb, pix:p};
  }
  if(payMethod==='fiado'){
    if(!selectedClientId){ showToast('Selecione o cliente para venda fiado.'); return; }
    cliente = DB.clients.find(x=>x.id===selectedClientId);
    if(!cliente){ showToast('Cliente não encontrado.'); return; }
    if(cliente.limiteCredito>0 && (cliente.saldoDevedor+total) > cliente.limiteCredito){
      showToast('Limite de crédito excedido para '+cliente.name+' (limite: '+brl(cliente.limiteCredito)+').');
      return;
    }
  }
  const somaPorProduto = {};
  cart.forEach(i=>{ somaPorProduto[i.productId] = (somaPorProduto[i.productId]||0) + i.qty; });
  for(const productId in somaPorProduto){
    const p = DB.products.find(x=>x.id===productId);
    if(!p || p.stock < somaPorProduto[productId]){ showToast('Estoque insuficiente para '+(p?p.name:'produto')); return; }
  }
  Object.keys(somaPorProduto).forEach(productId=>{
    const p = DB.products.find(x=>x.id===productId);
    p.stock -= somaPorProduto[productId];
    DB.movements.push({id:uid(), productId:p.id, productName:p.name, type:'saida', qty:somaPorProduto[productId], reason:'Venda (PDV)', operator:operatorName, date:nowISO()});
  });
  const produtosAgoraBaixos = Object.keys(somaPorProduto)
    .map(id=>DB.products.find(x=>x.id===id))
    .filter(p=>p && p.stock<=(p.minStock||0));
  const sale = { id:uid(), date:nowISO(), operator:operatorName, items:cart.map(i=>({...i})), total, payMethod, sessionId:session.id, clientId: cliente?cliente.id:null, clientName: cliente?cliente.name:null, valorRecebido, troco, mistoBreakdown };
  DB.sales.push(sale);
  const saveOps = [saveKey(KEYS.products, DB.products), saveKey(KEYS.movements, DB.movements), saveKey(KEYS.sales, DB.sales)];
  if(cliente){ cliente.saldoDevedor = (cliente.saldoDevedor||0) + total; saveOps.push(saveKey(KEYS.clients, DB.clients)); }
  await Promise.all(saveOps);
  showToast(cliente ? '✅ Venda fiado de '+brl(total)+' registrada para '+cliente.name+'!' : '✅ Venda de '+brl(total)+' registrada!');
  if(produtosAgoraBaixos.length>0){
    showToast('⚠️ Estoque mínimo atingido: '+produtosAgoraBaixos.map(p=>p.name).join(', '), 5000);
  }
  selectedClientId = '';
  payMethod = 'dinheiro';
  await imprimirRecibo(sale);
  cart = [];
  renderContent();
  if(DB.settings.autoPrint!==false){
    abrirPreviewCupom(sale);
  }
}

/* ---- leitura de código de barras via câmera ---- */
let camStream = null;
async function openCameraScan(){
  if(!('BarcodeDetector' in window)){
    showToast('Este navegador não tem suporte nativo à câmera para leitura de código de barras. Use um leitor USB, que funciona digitando direto no campo de busca.');
    return;
  }
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeCameraScan()">
      <div class="modal">
        <h3>📷 Aponte para o código de barras</h3>
        <div id="camWrap"><video id="camVideo" autoplay playsinline muted></video><div class="cam-frame"></div></div>
        <div class="modal-actions"><button class="btn btn-ghost btn-block" onclick="closeCameraScan()">Cancelar</button></div>
      </div>
    </div>`;
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video = document.getElementById('camVideo');
    video.srcObject = camStream;
    const detector = new BarcodeDetector();
    const scanLoop = async ()=>{
      if(!camStream) return;
      try{
        const codes = await detector.detect(video);
        if(codes.length){
          const val = codes[0].rawValue;
          const p = DB.products.find(x=>x.barcode===val);
          closeCameraScan();
          if(p){
            document.getElementById('inputProduto').value = p.name;
            onProdutoDigitado();
            adicionarItemVenda();
            showToast('Produto lido: '+p.name);
          }
          else showToast('Nenhum produto cadastrado com esse código: '+val);
          return;
        }
      }catch(err){}
      if(camStream) requestAnimationFrame(scanLoop);
    };
    scanLoop();
  }catch(err){
    showToast('Não foi possível acessar a câmera. Verifique as permissões do navegador.');
    closeCameraScan();
  }
}
function closeCameraScan(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  closeModal();
}

/* ================================================================
   ENTRADA PELA NOTA FISCAL (DANFE / XML da NF-e)
   1) Bipa o código de barras do DANFE -> chave de 44 dígitos (conferida)
   2) Escolhe o XML da nota -> itens carregados sozinhos
   3) Confere item por item e confirma -> soma no estoque
   Nada muda sem o "Confirmar entrada". Preço de venda nunca é mexido.
   ================================================================ */
let nfChaveLida = null;      // {chave, uf, aamm, cnpj, modelo, serie, numero}
let nfConferencia = null;    // nota carregada do XML, aguardando conferência
let nfAguardandoCadastroIdx = null;
const NF_UF = {11:'RO',12:'AC',13:'AM',14:'RR',15:'PA',16:'AP',17:'TO',21:'MA',22:'PI',23:'CE',24:'RN',25:'PB',26:'PE',27:'AL',28:'SE',29:'BA',31:'MG',32:'ES',33:'RJ',35:'SP',41:'PR',42:'SC',43:'RS',50:'MS',51:'MT',52:'GO',53:'DF'};
function nfFormatarChave(c){ return String(c||'').replace(/(\d{4})(?=\d)/g,'$1 '); }
function nfFormatarCNPJ(c){ c=String(c||''); return c.length===14 ? c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5') : (c.length===11 ? c.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4') : c); }
function nfDigitoChave(c43){
  let soma=0, peso=2;
  for(let i=c43.length-1;i>=0;i--){ soma += Number(c43[i])*peso; peso = peso===9 ? 2 : peso+1; }
  const r = soma % 11;
  return (r===0||r===1) ? 0 : 11-r;
}
function nfLerChave(txt){
  const chave = String(txt||'').replace(/\D/g,'');
  if(chave.length!==44) return {erro:'A chave precisa ter 44 números. Foram lidos '+chave.length+'. Bipe de novo o código de barras do DANFE.'};
  if(nfDigitoChave(chave.slice(0,43))!==Number(chave[43])) return {erro:'Essa chave não confere (o último número está errado). Bipe de novo, com calma.'};
  const uf = NF_UF[Number(chave.slice(0,2))];
  if(!uf) return {erro:'Essa chave não é de nota fiscal (estado inválido).'};
  const modelo = chave.slice(20,22);
  return {chave, uf, aamm:chave.slice(4,6)+'/20'+chave.slice(2,4), cnpj:chave.slice(6,20), modelo,
          serie:String(Number(chave.slice(22,25))), numero:String(Number(chave.slice(25,34)))};
}

function nfConferirChave(){
  const el = document.getElementById('nfChaveInput'); if(!el) return;
  const val = el.value.trim();
  if(!val){ nfChaveLida=null; renderContent(); return; }
  if(/https?:|\?p=|www\./i.test(val)) return nfLerQrCupom(val);
  const r = nfLerChave(val);
  if(r.erro){ nfChaveLida=null; showToast('❌ '+r.erro, 7000); el.select(); return; }
  if(nfChaveLida && nfChaveLida.chave===r.chave) return;
  if(r.modelo==='65'){ r.url = 'https://www.nfce.fazenda.sp.gov.br/consulta'; r.digitada = true; nfTextoCupom=''; }
  nfChaveLida = r;

  if(nfJaImportada(r.chave)) showToast('⚠️ Esta nota já foi lançada antes.', 6000);

/* ---- Cupom fiscal (NFC-e) pelo QR Code ----
   O QR abre a consulta pública da SEFAZ, que mostra os itens sem certificado.
   O gestor não pode ler outro site sozinho (o navegador bloqueia), então:
   abre a página, a pessoa copia tudo (Ctrl+A, Ctrl+C) e cola aqui. */
function nfLerQrCupom(val){
  let url = val.trim();
  if(!/^https?:/i.test(url)) url = 'https://'+url.replace(/^\/+/,'');
  const m = url.match(/[?&]p=([^&]+)/i) || url.match(/chNFe=(\d{44})/i);
  const digitos = m ? decodeURIComponent(m[1]).replace(/\D/g,'') : '';
  const r = nfLerChave(digitos.slice(0,44));
  if(r.erro){ showToast('❌ Não consegui ler esse QR Code. Bipe de novo o QR do cupom.', 7000); return; }
  r.url = url;
  if(nfChaveLida && nfChaveLida.chave===r.chave) return;
  nfChaveLida = r; nfTextoCupom = '';
  renderContent();
  if(nfJaImportada(r.chave)) showToast('⚠️ Este cupom já foi lançado antes.', 6000);
}
let nfTextoCupom = '';
async function nfAbrirCupomSefaz(){
  if(!nfChaveLida || !nfChaveLida.url) return;
  if(nfChaveLida.digitada){
    try{ await navigator.clipboard.writeText(nfChaveLida.chave); showToast('Chave copiada. No site da SEFAZ, cole com Ctrl+V e faça a consulta.', 8000); }catch(e){ showToast('Copie a chave: '+nfChaveLida.chave, 10000); }
  }
  window.open(nfChaveLida.url, '_blank');
}
/* Ler o QR Code sem leitor: pela câmera do computador ou por uma foto */
let nfCamStream = null, nfCamTimer = null;
function nfQrEncontrado(texto){
  nfFecharCamera();
  const el = document.getElementById('nfChaveInput'); if(el) el.value = texto;
  if(/https?:|\?p=|www\./i.test(texto)) nfLerQrCupom(texto);
  else { const r = nfLerChave(texto); if(r.erro){ showToast('❌ Esse QR Code não é de cupom fiscal.', 6000); return; } nfConferirChave(); }
}
async function nfAbrirCamera(){
  if(typeof jsQR!=='function'){ showToast('Leitor de QR indisponível.'); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showToast('Este computador não deixa usar a câmera. Use "Ler QR de uma foto".', 7000); return; }
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) nfFecharCamera()">
      <div class="modal wide" style="text-align:center;">
        <h3>📷 Mostre o QR Code do cupom para a câmera</h3>
        <video id="nfCamVideo" playsinline muted style="width:100%;max-height:60vh;background:#000;border-radius:12px;"></video>
        <div class="small-note">Segure o cupom parado, perto da câmera, com boa luz. Ele lê sozinho.</div>
        <div class="modal-actions"><button class="btn btn-outline" onclick="nfFecharCamera()">Fechar</button></div>
      </div>
    </div>`;
  try{
    nfCamStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1280}, height:{ideal:720}}});
  }catch(e){ closeModal(); showToast('Não consegui abrir a câmera (sem câmera ou permissão negada). Use "Ler QR de uma foto".', 8000); return; }
  const v = document.getElementById('nfCamVideo'); if(!v){ nfFecharCamera(); return; }
  v.srcObject = nfCamStream; await v.play().catch(()=>{});
  const cv = document.createElement('canvas'); const ctx = cv.getContext('2d', {willReadFrequently:true});
  nfCamTimer = setInterval(()=>{
    if(!v.videoWidth) return;
    cv.width = v.videoWidth; cv.height = v.videoHeight; ctx.drawImage(v,0,0);
    const img = ctx.getImageData(0,0,cv.width,cv.height);
    const r = jsQR(img.data, img.width, img.height, {inversionAttempts:'dontInvert'});
    if(r && r.data){ showToast('✅ QR Code lido!'); nfQrEncontrado(r.data); }
  }, 250);
}
function nfFecharCamera(){
  if(nfCamTimer){ clearInterval(nfCamTimer); nfCamTimer=null; }
  if(nfCamStream){ nfCamStream.getTracks().forEach(t=>t.stop()); nfCamStream=null; }
  if(document.getElementById('nfCamVideo')) closeModal();
}
// Procura QR no canvas: imagem inteira e depois pedaços ampliados (QR pequeno em cupom escaneado)
function nfProcurarQrNoCanvas(src, soRapido){
  const W = src.width, H = src.height;
  const tentar = (sx,sy,sw,sh,alvo)=>{
    const esc = Math.min(3, alvo/Math.max(sw,sh));
    const cv = document.createElement('canvas'); cv.width = Math.max(1,Math.round(sw*esc)); cv.height = Math.max(1,Math.round(sh*esc));
    const ctx = cv.getContext('2d', {willReadFrequently:true}); ctx.imageSmoothingEnabled = true; ctx.drawImage(src,sx,sy,sw,sh,0,0,cv.width,cv.height);
    const d = ctx.getImageData(0,0,cv.width,cv.height);
    const r = jsQR(d.data, d.width, d.height, {inversionAttempts:'attemptBoth'});
    return r && r.data ? r.data : null;
  };
  for(const alvo of [1600, 1000]){ const r = tentar(0,0,W,H,alvo); if(r) return r; }
  if(soRapido) return null;
  const menor = Math.min(W,H);
  for(const frac of [0.5, 0.35, 0.25]){
    const lado = Math.round(menor*frac), passo = Math.max(1, Math.round(lado/2));
    for(let y=0; y<=H-lado+passo; y+=passo){
      for(let x=0; x<=W-lado+passo; x+=passo){
        const sx = Math.min(x, W-lado), sy = Math.min(y, H-lado);
        const r = tentar(Math.max(0,sx), Math.max(0,sy), Math.min(lado,W), Math.min(lado,H), 700);
        if(r) return r;
      }
    }
  }
  return null;
}
function nfChaveNoTexto(texto){
  const linhas = String(texto||'').split(/\n/);
  const blocos = linhas.map(l=>l.replace(/\D/g,'')).concat([String(texto||'').replace(/\D/g,'')]);
  for(const d of blocos){
    for(let i=0; i+44<=d.length; i++){ const c = d.slice(i,i+44); const r = nfLerChave(c); if(!r.erro) return c; }

let _pdfjsPromise = null;
function nfCarregarPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(_pdfjsPromise) return _pdfjsPromise;
  _pdfjsPromise = new Promise((ok,erro)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = ()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); }catch(e){ erro(e); } };
    sc.onerror = ()=>{ _pdfjsPromise = null; erro(new Error('sem internet')); };
    document.head.appendChild(sc);
  });
  return _pdfjsPromise;
}
async function nfLerPdf(file){
  showToast('Lendo o PDF... aguarde.', 4000);
  let pdfjs;
  try{ pdfjs = await nfCarregarPdfJs(); }catch(e){ showToast('❌ Para ler PDF o computador precisa de internet. Ou digite os 44 números da chave.', 8000); return; }
  try{
    const pdf = await pdfjs.getDocument({data: await file.arrayBuffer()}).promise;
    const pag = await pdf.getPage(1);
    // 1) QR Code (cupom) — leva direto aos itens na SEFAZ
    const vp = pag.getViewport({scale: 3});
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    await pag.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    let qr = nfProcurarQrNoCanvas(cv, true);
    if(qr){ showToast('✅ QR Code lido do PDF!'); nfQrEncontrado(qr); return; }
    // 2) Números da chave escritos no papel (texto do PDF escaneado)
    const tc = await pag.getTextContent();
    let texto = ''; let ultY = null;
    for(const it of tc.items){ const y = it.transform ? Math.round(it.transform[5]) : 0; texto += (ultY!==null && Math.abs(y-ultY)>3 ? '\n' : ' ') + it.str; ultY = y; }
    const chave = nfChaveNoTexto(texto);
    // Nota (DANFE, modelo 55): a chave basta. Cupom (65): tenta achar o QR, que leva direto aos itens.
    if(chave && chave.slice(20,22)!=='65'){ showToast('✅ Chave lida do PDF!'); nfQrEncontrado(chave); return; }
    await new Promise(r=>setTimeout(r,30));
    qr = nfProcurarQrNoCanvas(cv, false);
    if(qr){ showToast('✅ QR Code lido do PDF!'); nfQrEncontrado(qr); return; }
    if(chave){ showToast('✅ Chave lida do PDF!'); nfQrEncontrado(chave); return; }
    showToast('❌ Não achei o QR Code nem a chave nesse PDF. Digite os 44 números da chave que estão no papel.', 9000);
  }catch(e){ console.error(e); showToast('❌ Não consegui abrir esse PDF.', 6000); }
}

function nfEscolherProduto(i, val){
  const it = nfConferencia.itens[i]; val = String(val||'').trim();
  if(!val){ it.productId=''; it.como=''; renderContent(); return; }
  const k = chaveCodigo(val);
  const p = DB.products.find(x=>x.name===val) || (k ? DB.products.find(x=>chaveCodigo(x.barcode)===k) : null) || DB.products.find(x=>chaveNome(x.name)===chaveNome(val));
  if(!p){ showToast('Produto não encontrado: "'+val+'". Escolha da lista ou use "Cadastrar produto novo".', 6000); renderContent(); return; }
  it.productId = p.id; it.como = 'você';
  renderContent();
}
function nfMudarEmbalagem(i, v){
  const it = nfConferencia.itens[i]; const e = parseFloat(v);
  if(!(e>0)){ renderContent(); return; }
  it.embalagem = e; it.qtdEntrada = +(it.qCom*e).toFixed(3); renderContent();
}
function nfMudarQtd(i, v){ const q = parseFloat(v); nfConferencia.itens[i].qtdEntrada = q>=0 ? q : 0; }
function nfCadastrarNovo(i){
  const it = nfConferencia.itens[i];
  nfAguardandoCadastroIdx = i;
  openProductModal(null, it.ean||'', it.ean ? '' : it.xProd);
  setTimeout(()=>{
    const custo = document.getElementById('mCusto');
    if(custo && !custo.value){ const tot = it.vProd + it.icms.vICMSST + it.vIPI; custo.value = (it.qtdEntrada>0 ? tot/it.qtdEntrada : it.vUnCom).toFixed(2); }
    const nome = document.getElementById('mNome');
    if(nome && !nome.value) nome.value = it.xProd;
  }, 400);
}
function nfProdutoCadastrado(prod){
  if(nfConferencia && nfAguardandoCadastroIdx!==null && nfConferencia.itens[nfAguardandoCadastroIdx]){
    const it = nfConferencia.itens[nfAguardandoCadastroIdx];

}
function nfCancelar(){
  if(!confirm('Cancelar a conferência desta nota? Nada foi lançado no estoque.')) return;
  nfConferencia = null; nfChaveLida = null; nfTextoCupom = ''; renderContent();
}
async function nfConfirmarEntrada(){
  const n = nfConferencia; if(!n) return;
  const itens = n.itens.filter(it=>it.productId && it.qtdEntrada>0);
  if(!itens.length){ showToast('Nenhum item ligado a um produto do estoque. Escolha os produtos antes de confirmar.', 6000); return; }
  const fora = n.itens.length - itens.length;
  const ja = nfJaImportada(n.chave);
  let msg = 'Confirmar a entrada da nota nº '+n.numero+'?\n\n'+itens.length+' itens vão somar no estoque.';
  if(fora) msg += '\n'+fora+' item(ns) sem produto ficam de fora.';
  if(n.atualizarCusto) msg += '\nO preço de custo será atualizado.';
  if(ja) msg = '⚠️ ESTA NOTA JÁ FOI LANÇADA ANTES!\nConfirmar de novo vai DOBRAR o estoque.\n\n'+msg;
  if(!confirm(msg)) return;
  const cnpj = n.fornecedor.cnpj;
  let forn = DB.suppliers.find(s=>s.cnpj && s.cnpj===cnpj) || DB.suppliers.find(s=>chaveNome(s.name)===chaveNome(n.fornecedor.fantasia||n.fornecedor.nome));
  if(!forn){
    forn = {id:uid(), name:n.fornecedor.fantasia||n.fornecedor.nome, cnpj, contato:'', telefone:n.fornecedor.telefone||'', email:'', endereco:n.fornecedor.endereco||'', obs:'Razão social: '+n.fornecedor.nome+' · CNPJ '+nfFormatarCNPJ(cnpj)+(n.fornecedor.ie?' · IE '+n.fornecedor.ie:'')+' (cadastrado pela nota fiscal)', createdAt:nowISO()};
    DB.suppliers.push(forn);
  }else if(!forn.cnpj){ forn.cnpj = cnpj; }
  DB.settings.vinculosNF = DB.settings.vinculosNF || {};
  const nfNumero = String(n.numero), nfData = n.dataEmissao || null;
  let seq = DB.movements.filter(m=>m.type==='entrada' && m.nfNumero===nfNumero).length;
  const agora = nowISO();
  for(const it of itens){
    const p = DB.products.find(x=>x.id===it.productId); if(!p) continue;
    const qty = +it.qtdEntrada;
    p.stock = +((Number(p.stock)||0) + qty).toFixed(3);
    if(n.atualizarCusto && qty>0){
      const custoUn = (it.vProd - it.vDesc + it.vFrete + it.vOutro + it.icms.vICMSST + it.vIPI) / qty;
      if(custoUn>0) p.cost = +custoUn.toFixed(2);
    }
    seq++;
    DB.movements.push({id:uid(), productId:p.id, productName:p.name, type:'entrada', qty,
      reason:'Compra de fornecedor — NF-e '+nfNumero+' '+(n.fornecedor.fantasia||n.fornecedor.nome)+' (item '+it.nItem+': '+it.xProd+')',
      operator:operatorName, date:agora, nfNumero, nfData, nfSeq:seq, nfChave:n.chave});
    DB.settings.vinculosNF[cnpj+'|'+it.cProd] = {productId:p.id, embalagem:it.embalagem};
  }
  DB.settings.notasEntrada = DB.settings.notasEntrada || [];
  DB.settings.notasEntrada.push({chave:n.chave, numero:nfNumero, serie:n.serie, dataEmissao:nfData, fornecedor:n.fornecedor.nome, cnpj, valor:n.totais.vNF, itens:itens.length, importadaEm:agora, operador:operatorName});
  await Promise.all([saveKey(KEYS.products, DB.products), saveKey(KEYS.movements, DB.movements), saveKey(KEYS.suppliers, DB.suppliers), saveKey(KEYS.settings, DB.settings)]);
  nfConferencia = null; nfChaveLida = null; nfTextoCupom = "";
  showToast('✅ Entrada da nota nº '+nfNumero+' feita: '+itens.length+' itens somados no estoque.', 6000);
  renderContent();
  if(leitorFila.length) setTimeout(leitorProcessarFila, 1500);
}

    ${somaFormas.mistoCount>0?`<div class="small-note">🔀 ${somaFormas.mistoCount} venda(s) com pagamento misto nesta sessão — valores já divididos acima entre dinheiro, cartão (crédito/débito) e pix.</div>`:''}

async function fecharCaixa(esperado){
  const contado = parseFloat(document.getElementById('valorFechamento').value);
  if(isNaN(contado)){ showToast('Informe o valor contado.'); return; }
  const session = getOpenSession();
  const diferenca = contado - esperado;
  session.closedAt = nowISO(); session.closedBy = operatorName;
  session.valorEsperado = esperado; session.valorContado = contado; session.diferenca = diferenca;
  await saveKey(KEYS.caixaSessions, DB.caixaSessions);
  showToast(diferenca===0 ? '✅ Caixa fechado, sem diferenças.' : `Caixa fechado. Diferença: ${brl(diferenca)}`);

function movimentoDoDia(dataStr){
  const vendasDia = DB.sales.filter(s=>toLocalDateStr(s.date)===dataStr);
  const lancDia = DB.lancamentos.filter(l=>toLocalDateStr(l.date)===dataStr);
  const soma = somarPorFormaPagamento(vendasDia);
  const entradasVendas = soma.dinheiro + soma.cartao + soma.pix; // fiado fica de fora até virar recebimento
  let entOperacional = entradasVendas, entInvest=0, entFinanc=0, saiOperacional=0, saiInvest=0, saiFinanc=0;
  lancDia.forEach(l=>{
    const classe = classificarCategoria(l.category);
    if(l.type==='entrada'){
      if(classe==='investimento') entInvest+=l.value;
      else if(classe==='financiamento') entFinanc+=l.value;
      else entOperacional+=l.value;
    } else {
      if(classe==='investimento') saiInvest+=l.value;
      else if(classe==='financiamento') saiFinanc+=l.value;
      else saiOperacional+=l.value;
    }
  });
  return {
    entradas: entOperacional+entInvest+entFinanc, saidas: saiOperacional+saiInvest+saiFinanc,
    entOperacional, entInvest, entFinanc, saiOperacional, saiInvest, saiFinanc, vendasDia, lancDia
  };
}
// Saldo acumulado (saldo inicial configurado + tudo que se moveu) até uma data-limite (inclusive).
function saldoAcumuladoAte(dataLimite){
  const dataIni = DB.settings.saldoInicialData || todayISODate();
  let saldo = Number(DB.settings.saldoInicialCaixa)||0;
  if(dataLimite < dataIni) return saldo; // data pedida é anterior à referência do saldo inicial
  let cursor = new Date(dataIni+'T00:00:00');
  const limite = new Date(dataLimite+'T00:00:00');
  let guard = 0;
  while(cursor<=limite && guard<4000){
    const d = toLocalDateStr(cursor);
    const m = movimentoDoDia(d);
    saldo += m.entradas - m.saidas;
    cursor.setDate(cursor.getDate()+1); guard++;
  }
  return saldo;
}

}

function renderFluxoRealizado(){
  const {ini, fim} = fluxoRange();
  const saldoInicialPeriodo = saldoAcumuladoAte(toLocalDateStr(new Date(new Date(ini+'T00:00:00').getTime()-86400000)));

  const dias = [];
  let cursor = new Date(ini+'T00:00:00');
  const limite = new Date(fim+'T00:00:00');
  while(cursor<=limite && dias.length<400){ dias.push(toLocalDateStr(cursor)); cursor.setDate(cursor.getDate()+1); }

  let saldoAcumulado = saldoInicialPeriodo;
  const linhas = dias.map(d=>{
    const m = movimentoDoDia(d);
    const saldoDia = m.entradas - m.saidas;
    saldoAcumulado += saldoDia;
    return Object.assign({d, saldoDia, saldoAcumulado}, m);
  });

  const totalEntradas = linhas.reduce((a,l)=>a+l.entradas,0);
  const totalSaidas = linhas.reduce((a,l)=>a+l.saidas,0);
  const entOperTotal = linhas.reduce((a,l)=>a+l.entOperacional,0);
  const saiOperTotal = linhas.reduce((a,l)=>a+l.saiOperacional,0);
  const entInvestTotal = linhas.reduce((a,l)=>a+l.entInvest,0);
  const saiInvestTotal = linhas.reduce((a,l)=>a+l.saiInvest,0);
  const entFinancTotal = linhas.reduce((a,l)=>a+l.entFinanc,0);
  const saiFinancTotal = linhas.reduce((a,l)=>a+l.saiFinanc,0);
  const fluxoOperacional = entOperTotal - saiOperTotal;
  const fluxoInvestimento = entInvestTotal - saiInvestTotal;
  const fluxoFinanciamento = entFinancTotal - saiFinancTotal;
  const saldoFinalPeriodo = saldoInicialPeriodo + totalEntradas - totalSaidas;
  const totalAReceberGeral = DB.clients.reduce((a,c)=>a+(c.saldoDevedor||0),0);
  const linhasComMovimento = linhas.filter(l=>l.entradas>0.001 || l.saidas>0.001);

  // Entradas por categoria
  const vendasPeriodo = DB.sales.filter(s=>inRange(s.date, ini, fim));
  const somaVendasPeriodo = somarPorFormaPagamento(vendasPeriodo);
  const entradasVendasPeriodo = somaVendasPeriodo.dinheiro + somaVendasPeriodo.cartao + somaVendasPeriodo.pix;
  const lancPeriodo = DB.lancamentos.filter(l=>inRange(l.date, ini, fim));

  const entCatList = Object.entries(entCatMap).sort((a,b)=>b[1]-a[1]);
  const maxEntCat = entCatList.length? Math.max(...entCatList.map(x=>x[1])) : 1;

  const saiCatList = Object.entries(saiCatMap).sort((a,b)=>b[1]-a[1]);
  const maxSaiCat = saiCatList.length? Math.max(...saiCatList.map(x=>x[1])) : 1;

  return `

      <button class="${fluxoPeriodo==='30dias'?'active':''}" onclick="fluxoPeriodo='30dias'; renderContent()">Últimos 30 dias</button>
      <button class="${fluxoPeriodo==='mes'?'active':''}" onclick="fluxoPeriodo='mes'; renderContent()">Este mês</button>
      <button class="${fluxoPeriodo==='personalizado'?'active':''}" onclick="fluxoPeriodo='personalizado'; renderContent()">Período personalizado</button>
    </div>
    ${fluxoPeriodo==='personalizado' ? `
      <div class="grid2" style="gap:12px; margin-top:6px;">
        <div class="field"><label>Data inicial</label><input type="date" value="${fluxoDataIni}" onchange="fluxoDataIni=this.value; renderContent();"></div>
        <div class="field"><label>Data final</label><input type="date" value="${fluxoDataFim}" onchange="fluxoDataFim=this.value; renderContent();"></div>

  <div class="grid2">

      ${entCatList.length===0?'<div class="empty-state">Sem entradas no período.</div>':entCatList.map(([cat,val])=>`

function renderFluxoProjetado(){

  const saldoAtual = saldoAcumuladoAte(toLocalDateStr(new Date(Date.now()-86400000)));
  const pendentes = DB.contas.filter(c=>c.status==='pendente' && c.vencimento>=hoje && c.vencimento<=dataLimite).sort((a,b)=>a.vencimento.localeCompare(b.vencimento));

  const porDia = {};
  pendentes.forEach(c=>{
    if(!porDia[c.vencimento]) porDia[c.vencimento] = {entradas:0, saidas:0};
    if(c.tipo==='receber') porDia[c.vencimento].entradas += c.valor;
    else porDia[c.vencimento].saidas += c.valor;
  });
  const diasComConta = Object.keys(porDia).sort();
  let saldoProjAcumulado = saldoAtual;
  let temFuro = false;
  const linhas = diasComConta.map(d=>{
    const saldoDia = porDia[d].entradas - porDia[d].saidas;
    saldoProjAcumulado += saldoDia;
    if(saldoProjAcumulado<0) temFuro = true;
    return {d, entradas:porDia[d].entradas, saidas:porDia[d].saidas, saldoDia, saldoProjAcumulado};
  });

  const totalReceberProj = pendentes.filter(c=>c.tipo==='receber').reduce((a,c)=>a+c.valor,0);
  const totalPagarProj = pendentes.filter(c=>c.tipo==='pagar').reduce((a,c)=>a+c.valor,0);

  return `

    <div class="stat"><div class="lbl">A receber no período</div><div class="val">${brl(totalReceberProj)}</div></div>
    <div class="stat bad"><div class="lbl">A pagar no período</div><div class="val">${brl(totalPagarProj)}</div></div>
    <div class="stat ${saldoAtual+totalReceberProj-totalPagarProj<0?'bad':'accent'}"><div class="lbl">Saldo projetado final</div><div class="val">${brl(saldoAtual+totalReceberProj-totalPagarProj)}</div></div>
  </div>
  ${temFuro?`<div class="alert-banner">
    <div class="txt">⚠️ Atenção: nas contas já cadastradas, o saldo projetado fica NEGATIVO em algum dia deste período — possível falta de dinheiro em caixa. Veja a tabela abaixo para identificar a data.</div>
  </div>`:''}
  <div class="card">
    <h2>Previsão dia a dia</h2>
    <div class="desc">Só contas a pagar/receber com vencimento pendente entram aqui. Assim que forem marcadas como pagas/recebidas, saem daqui e passam a valer no Fluxo Realizado.</div>
    ${linhas.length===0?'<div class="empty-state">Nenhuma conta pendente com vencimento neste período.</div>':`

        ${linhas.map(l=>`

            <td class="right">${brl(l.entradas)}</td>

async function salvarConta(){
  const tipo = document.getElementById('contaTipo').value;
  const categoria = document.getElementById('contaCat').value;

  const vencimento = document.getElementById('contaVencimento').value;
  const descricao = document.getElementById('contaDesc').value.trim();
  if(!valor || valor<=0){ showToast('Informe um valor válido.'); return; }

  await saveKey(KEYS.contas, DB.contas);
  showToast('Conta cadastrada.');
  renderContent();
}

async function confirmarContaPaga(contaId){
  const c = DB.contas.find(x=>x.id===contaId);

  const valor = parseFloat(document.getElementById('contaPagValor').value);
  const data = document.getElementById('contaPagData').value;
  const forma = document.getElementById('contaPagForma').value;
  if(!valor || valor<=0){ showToast('Informe um valor válido.'); return; }
  c.status='pago'; c.dataPagamento=new Date(data).toISOString(); c.formaPagamento=forma; c.valorPago=valor;
  const lanc = {id:uid(), type:(c.tipo==='receber'?'entrada':'saida'), category:c.categoria, value:valor, paymentMethod:forma,
    description:(c.descricao||c.categoria)+' (conta '+(c.tipo==='receber'?'a receber':'a pagar')+')', operator:operatorName, date:new Date(data).toISOString(), contaId:c.id};
  DB.lancamentos.push(lanc);

  closeModal();
  showToast('✅ Registrado no fluxo de caixa em '+new Date(data).toLocaleDateString('pt-BR')+'.');

}

async function salvarEdicaoFormaPagamento(id){
  const s = DB.sales.find(x=>x.id===id);
  if(!s){ showToast('Venda não encontrada.'); return; }
  const novaForma = document.getElementById('editPayMethod').value;
  const formaIgual = novaForma===s.payMethod && novaForma!=='fiado';
  if(formaIgual){ showToast('A forma de pagamento já é essa.'); closeModal(); return; }
  let novoClienteId = null, novoClienteNome = null;
  if(novaForma==='fiado'){
    const sel = document.getElementById('editPayCliente');
    if(!sel || !sel.value){ showToast('Selecione o cliente para fiado.'); return; }
    novoClienteId = sel.value;
    const cli = DB.clients.find(x=>x.id===novoClienteId);
    novoClienteNome = cli ? cli.name : null;
  }
  const saveOps = [];
  let clientesMudaram = false;
  // Se a venda ERA fiado, devolve (abate) o saldo do cliente antigo
  if(s.payMethod==='fiado' && s.clientId){
    const cliAntigo = DB.clients.find(x=>x.id===s.clientId);
    if(cliAntigo){ cliAntigo.saldoDevedor = Math.max(0, (cliAntigo.saldoDevedor||0) - s.total); clientesMudaram = true; }
  }
  // Se a NOVA forma é fiado, lança o valor no cliente novo
  if(novaForma==='fiado'){
    const cliNovo = DB.clients.find(x=>x.id===novoClienteId);
    if(cliNovo){ cliNovo.saldoDevedor = (cliNovo.saldoDevedor||0) + s.total; clientesMudaram = true; }
  }
  if(clientesMudaram) saveOps.push(saveKey(KEYS.clients, DB.clients));
  s.payMethod = novaForma;
  s.clientId = novaForma==='fiado' ? novoClienteId : null;
  s.clientName = novaForma==='fiado' ? novoClienteNome : null;
  s.mistoBreakdown = null;
  if(novaForma!=='dinheiro'){ s.valorRecebido = null; s.troco = null; }
  saveOps.push(saveKey(KEYS.sales, DB.sales));
  await Promise.all(saveOps);
  closeModal();
  showToast('✅ Forma de pagamento alterada para '+labelFormaPagamento(novaForma)+'.');
  renderContent();
}

          <div class="field">

            </select>

          <div class="field"><label>Quantidade</label><input type="number" min="0.001" step="1" id="edicaoNovaQtd" value="1"></div>

          ${(s.payMethod==='misto'||s.payMethod==='dinheiro')?'⚠️ Como o total pode mudar, a forma de pagamento detalhada ('+(s.payMethod==='misto'?'divisão do misto':'valor recebido/troco')+') será limpa — revise em "✏️ Pagamento" depois de salvar.':''}
        </div>

  const existente = edicaoVendaItens.find(i=>i.productId===productId && i.price===p.price);
  if(existente) existente.qty += qty;
  else edicaoVendaItens.push({productId:p.id, name:p.name, price:p.price, cost:p.cost||0, qty, saleType:p.saleType||'unidade'});

}
async function salvarEdicaoItensVenda(){
  const s = DB.sales.find(x=>x.id===edicaoVendaId);
  if(!s){ showToast('Venda não encontrada.'); return; }
  if(edicaoVendaItens.length===0){ showToast('A venda precisa ter pelo menos um item. Para apagar a venda inteira, use "Excluir".'); return; }
  for(const i of edicaoVendaItens){
    if(!i.qty || i.qty<=0 || !i.price || i.price<=0){ showToast('Há um item com quantidade ou preço inválido.'); return; }
  }
  const totalAntigoPreCheck = s.total;
  const novoTotalPreCheck = edicaoVendaItens.reduce((a,i)=>a+i.price*i.qty,0);
  if(s.payMethod==='fiado' && s.clientId){
    const clientePreCheck = DB.clients.find(x=>x.id===s.clientId);
    if(clientePreCheck && clientePreCheck.limiteCredito>0){
      const saldoSemEstaVenda = Math.max(0, (clientePreCheck.saldoDevedor||0) - totalAntigoPreCheck);
      if((saldoSemEstaVenda + novoTotalPreCheck) > clientePreCheck.limiteCredito){
        showToast('❌ Esse novo total ('+brl(novoTotalPreCheck)+') deixaria '+clientePreCheck.name+' acima do limite de crédito ('+brl(clientePreCheck.limiteCredito)+'). Reduza os itens, ou aumente o limite do cliente em Cadastros → Clientes.', 8000);
        return;
      }
    }
  }
  // 1) Devolve ao estoque os itens da venda ORIGINAL (estorno)
  const porProdutoAntigo = {};
  s.items.forEach(i=>{ porProdutoAntigo[i.productId] = (porProdutoAntigo[i.productId]||0) + i.qty; });
  const movimentosEstorno = [];
  Object.keys(porProdutoAntigo).forEach(productId=>{
    const p = DB.products.find(x=>x.id===productId);
    if(p){
      p.stock += porProdutoAntigo[productId];
      const mov = {id:uid(), productId:p.id, productName:p.name, type:'entrada', qty:porProdutoAntigo[productId], reason:'Estorno — edição de venda', operator:operatorName, date:nowISO()};
      DB.movements.push(mov);
      movimentosEstorno.push(mov);
    }
  });
  // 2) Confere se há estoque suficiente para os itens NOVOS (depois do estorno acima)
  const porProdutoNovo = {};
  edicaoVendaItens.forEach(i=>{ porProdutoNovo[i.productId] = (porProdutoNovo[i.productId]||0) + i.qty; });
  for(const productId in porProdutoNovo){
    const p = DB.products.find(x=>x.id===productId);
    if(!p || p.stock < porProdutoNovo[productId]){
      showToast('Estoque insuficiente para '+(p?p.name:'produto')+' — a edição foi cancelada e o estoque original não foi alterado.');
      // desfaz o estorno acima pra não deixar o estoque inconsistente
      Object.keys(porProdutoAntigo).forEach(productId2=>{
        const p2 = DB.products.find(x=>x.id===productId2);
        if(p2) p2.stock -= porProdutoAntigo[productId2];
      });
      DB.movements = DB.movements.filter(m=>movimentosEstorno.indexOf(m)===-1);
      return;
    }
  }
  // 3) Retira do estoque os itens NOVOS
  Object.keys(porProdutoNovo).forEach(productId=>{
    const p = DB.products.find(x=>x.id===productId);
    p.stock -= porProdutoNovo[productId];
    DB.movements.push({id:uid(), productId:p.id, productName:p.name, type:'saida', qty:porProdutoNovo[productId], reason:'Venda (PDV) — editada', operator:operatorName, date:nowISO()});
  });
  // 4) Recalcula o total e ajusta fiado / detalhes de pagamento que dependiam do valor antigo
  const totalAntigo = s.total;
  const novoTotal = edicaoVendaItens.reduce((a,i)=>a+i.price*i.qty,0);
  const saveOps = [saveKey(KEYS.products, DB.products), saveKey(KEYS.movements, DB.movements)];
  if(s.payMethod==='fiado' && s.clientId){
    const cliente = DB.clients.find(x=>x.id===s.clientId);
    if(cliente){
      cliente.saldoDevedor = Math.max(0, (cliente.saldoDevedor||0) - totalAntigo) + novoTotal;
      saveOps.push(saveKey(KEYS.clients, DB.clients));
    }
  }
  if(s.payMethod==='misto'){ s.mistoBreakdown = null; }
  if(s.payMethod==='dinheiro'){ s.valorRecebido = null; s.troco = null; }
  s.items = edicaoVendaItens.map(i=>({...i}));
  s.total = novoTotal;
  saveOps.push(saveKey(KEYS.sales, DB.sales));
  await Promise.all(saveOps);
  closeModal();
  showToast('✅ Itens da venda atualizados — de '+brl(totalAntigo)+' para '+brl(novoTotal)+'. Estoque e relatórios já refletem a mudança.', 6000);
  renderContent();
}
async function reimprimirVenda(id){
  const s = DB.sales.find(x=>x.id===id);
  if(!s) return;
  abrirPreviewCupom(s);
}
async function excluirVenda(id){
  const s = DB.sales.find(x=>x.id===id);
  if(!s){ showToast('Venda não encontrada.'); return; }
  const itensTxt = s.items.map(i=>i.name+' x'+i.qty).join(', ');
  let avisoFiado = '';
  if(s.payMethod==='fiado' && s.clientId){
    avisoFiado = '\n\nEssa venda era FIADO — o saldo devedor de '+(s.clientName||'cliente')+' também vai ser reduzido em '+brl(s.total)+'.';
  }
  const confirmMsg = 'Excluir esta venda de '+brl(s.total)+' ('+itensTxt+')?\n\n'
    + 'Isso vai apagar a venda do histórico e do financeiro, e devolver os itens ao estoque.'+avisoFiado+' Essa ação não pode ser desfeita. Deseja continuar?';
  if(!confirm(confirmMsg)) return;
  const saveOps = [];
  s.items.forEach(item=>{
    const p = DB.products.find(x=>x.id===item.productId);
    if(p){
      p.stock += item.qty;
      DB.movements.push({id:uid(), productId:p.id, productName:p.name, type:'entrada', qty:item.qty, reason:'Estorno — venda excluída', operator:operatorName, date:nowISO()});
    }
  });
  saveOps.push(saveKey(KEYS.products, DB.products), saveKey(KEYS.movements, DB.movements));
  if(s.payMethod==='fiado' && s.clientId){
    const c = DB.clients.find(x=>x.id===s.clientId);
    if(c){
      c.saldoDevedor = Math.max(0, (c.saldoDevedor||0) - s.total);
      saveOps.push(saveKey(KEYS.clients, DB.clients));
    }
  }
  DB.sales = DB.sales.filter(x=>x.id!==id);
  saveOps.push(saveKey(KEYS.sales, DB.sales));
  await Promise.all(saveOps);
  showToast('Venda excluída, itens devolvidos ao estoque'+(s.payMethod==='fiado'&&s.clientId?' e saldo devedor atualizado.':'.'));
  renderContent();
}

function periodoRange(){
  if(relPeriodo==='dia'){ const d=todayISODate(); return {ini:d, fim:d}; }
  if(relPeriodo==='mes'){
    const now = new Date(); const ini = toLocalDateStr(new Date(now.getFullYear(), now.getMonth(), 1));
    const fim = toLocalDateStr(new Date(now.getFullYear(), now.getMonth()+1, 0));
    return {ini, fim};
  }
  return {ini:relDataIni, fim:relDataFim};
}
function inRange(dateISO, ini, fim){
  const d = toLocalDateStr(dateISO);
  return d>=ini && d<=fim;
}

function itensAgrupadosPorProduto(vendas){
  const porProduto = {};
  vendas.forEach(s=>s.items.forEach(i=>{
    const key = i.productId || i.name;
    if(!porProduto[key]) porProduto[key] = {codigo:'', descricao:i.name, unid: i.saleType==='peso'?'KG':'UN', qtde:0, total:0};
    porProduto[key].qtde += i.qty;
    porProduto[key].total += i.price*i.qty;
    if(!porProduto[key].codigo){
      const p = DB.products.find(x=>x.id===i.productId);
      porProduto[key].codigo = p ? (p.barcode||'—') : '—';
    }
  }));
  return Object.values(porProduto).sort((a,b)=>a.descricao.localeCompare(b.descricao));
}
